name: Deploy History

# 배포 이력을 파이프라인이 남긴다 (#410 · #420 · ssccops#340 · ssccops#344 · Epic ssccops#338).
#
# «어느 환경에 어떤 커밋이 언제 올라갔고 무엇이 들었나»에 답하는 자리가 없었다 — 태그·릴리스
# 노트(사람이 씀)·Coolify 배포 화면·/actuator/info 가 흩어져 있고 어느 것도 «실제로 떴다»와
# «무슨 PR이 들었다»를 한 줄로 잇지 못했다. 이 워크플로는 **배포 주체를 바꾸지 않는다** — 그
# 이벤트에 «기록만» 얹으며 손으로 쓰는 칸은 없다.
#
# **배포 주체는 dev 와 prod 가 갈렸다** (#569 · ssccops#513):
#   - dev  : develop 푸시 → Integrate Dev(검증) → deploy-dev.yml 이 이미지를 GHCR 에 올리고
#            Coolify 배포 웹훅을 부른다. Coolify 는 그 이미지를 받아 띄우기만 한다
#   - prod : main 푸시(릴리스)를 Coolify 가 GitHub App 으로 받아 호스트에서 빌드해 배포한다(#202)
#
# 이 워크플로가 하는 일은 양쪽 모두 같다 — 푸시·릴리스 이벤트에서 시작해 /actuator/info 를
# 폴링한다. **dev 는 그 폴링이 «푸시 시각»부터 시작하는데 이제 배포가 CI 뒤에 시작한다** —
# 기다림의 구성이 «Coolify 큐 + 호스트 빌드»에서 «CI + Actions 이미지 빌드 + pull»로 바뀌었다.
# 아래 VERIFY_TIMEOUT_SECONDS 는 옛 구성으로 잰 값이라 전환 뒤 다시 재서 판단한다(ssccops#513 ③).
#
# 무엇을 하나:
#   1. 직전 배포 지점을 찾는다 — prod 는 직전 GitHub Release 의 태그, dev 는 server-dev.jsonl
#      마지막 레코드의 sha(없으면 push 이벤트의 before)
#   2. compare 로 사이의 커밋 → PR 번호·제목 → 제목의 [#N] Sub-task → cross-repo Parent(메타
#      이슈) → Parent 본문의 ADR-NNNN 을 취합한다 (.github/scripts/deploy-history-collect.sh)
#   3. /actuator/info 를 최대 10분 폴링해 git.commit.id 가 이 sha 와 같아지면 deployed, 아니면
#      status: unverified 로 남긴다 (.github/scripts/deploy-history-verify.sh). «배포됨»은 실제
#      응답으로만 확인한다 — 태그는 사람이 올린 값이라 증빙이 못 된다
#   4. JSON 한 줄을 **메타 레포(ssccops) orphan 브랜치 deploy-history 의 server-prod.jsonl /
#      server-dev.jsonl** 에 append 하고 푸시한다 (ADR-0033)
#
# 저장 위치가 메타 레포인 이유(#420 · ADR-0033): 이력은 한 곳에 있어야 «지금 prod 에 서버·웹이
# 무엇인가»를 한 번에 답하고, 메타 레포가 private 이라 GITHUB_TOKEN 으로는 Parent 이슈를 못 읽던
# 것도 같은 토큰으로 풀린다. 처음(#410)에는 이 레포의 orphan 브랜치였다 — 교차 레포 PAT 를 두
# 레포에 두기 싫어서였는데, 조직 소유 GitHub App(sscc-devops)의 설치 토큰은 사람에 안 묶이고
# 1시간짜리이며 발급 시 repositories: ssccops 로 좁힌다. 비밀은 조직 시크릿 하나다.
#
# 조직 변수·시크릿 (두 개발 레포에 공유 · 레포에는 아무것도 없다):
#   vars.SSCCOPS_DEPLOY_HISTORY_APP_ID     — sscc-devops 의 App ID
#   secrets.SSCCOPS_DEPLOY_HISTORY_APP_KEY — 그 앱의 개인키(PEM). Actions 전용으로 하나 더 발급한 것
#   vars.SSCCOPS_DEPLOY_HISTORY_ENV        — .env 모양 여러 줄. 이 워크플로는 SERVER_DEV_URL ·
#                                            SERVER_PROD_URL 만 읽는다(끝 슬래시 없이). 비어 있으면
#                                            폴링을 건너뛰고 unverified 로 남긴다(기록은 남아야 한다)
# 호스트를 여기 적지 않는다. image digest 는 Coolify 가 밖으로 내지 않아 싣지 않는다.

on:
  release:
    types: [published]
  push:
    branches: [develop]
  # 실제 이벤트 전에는 돌려 볼 수 없어 수동 실행을 열어 둔다. dev 에서 한 번 돌려 레코드가
  # 붙는지 확인하는 용도이며, ref 를 주면 그 커밋(prod 면 태그)을 기록한다.
  workflow_dispatch:
    inputs:
      environment:
        description: 기록할 환경
        type: choice
        options: [dev, prod]
        default: dev
      ref:
        description: 기록할 커밋 sha(dev) 또는 릴리스 태그(prod). 비우면 지금 ref
        required: false
        default: ''

# 이 레포에는 쓰지 않는다 — 메타 레포 쓰기는 App 토큰이 한다
permissions:
  contents: read
  pull-requests: read
  issues: read

# 두 이벤트가 겹쳐도 append 가 꼬이지 않게 직렬화한다. 취소하지 않는다 — 기록은 전부 남는다.
# (웹 레포와는 다른 파일에 쓰므로 그쪽과의 경합은 push 재시도로 푼다)
concurrency:
  group: deploy-history
  cancel-in-progress: false

env:
  SERVICE: ssccops-server
  SERVICE_KEY: server
  META_REPO: SoongSilComputingClub/ssccops
  HISTORY_BRANCH: deploy-history
  # 2026-09-24 실측에 맞춘 값이다 (#564 · ssccops#486). **dev 가 Actions 이미지 빌드로 옮겨간
  # 뒤(#569)의 값이 아니다** — 그쪽은 다시 재서 상위 이슈(ssccops#513 ③)에서 판단한다.
  # 600 이던 시절 dev 레코드 10건 중
  # 3건이 `unverified` 였는데 셋 다 실제로는 배포돼 있었다 — 확인이 배포보다 먼저 끝났을 뿐이다.
  #
  # | 잰 것 | 값 |
  # |---|---|
  # | 서버 dev 배포 소요(`1060f24`) | 13분 25초 |
  # | 그다음 배포가 큐에서 기다린 시간 | 19분 — 동시 빌드 1(ADR-0048)이라 웹 빌드 뒤에 선다 |
  #
  # 빌드 13분 + 큐를 합쳐 **40분**으로 둔다. 폴링은 20초 간격이고 sha 가 맞는 순간 빠져나오므로
  # 정상 배포에서는 이 값까지 쓰지 않는다 — 이 숫자는 «언제 포기하나»이지 «얼마나 기다리나»가
  # 아니다. 웹 워크플로는 Cloudflare·Vercel 이라 10분으로 충분하고 전부 `verified` 다.
  #
  # **빌드가 느려지면 이 값도 낡는다** — `unverified` 가 늘면 실제 배포 소요부터 다시 잰다.
  VERIFY_TIMEOUT_SECONDS: '2400'

jobs:
  record:
    name: Record
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # 조직 변수·시크릿이 없으면 여기서 멈춘다 — 조용히 자기 레포에 쓰는 길을 남기지 않는다
      # (두 곳에 갈라지는 것이 #420 이 없애려는 상태다)
      - name: Check org configuration
        env:
          APP_ID: ${{ vars.SSCCOPS_DEPLOY_HISTORY_APP_ID }}
          HAS_KEY: ${{ secrets.SSCCOPS_DEPLOY_HISTORY_APP_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::조직 변수 SSCCOPS_DEPLOY_HISTORY_APP_ID 와 조직 시크릿 SSCCOPS_DEPLOY_HISTORY_APP_KEY 가 있어야 한다 (ssccops#344)"
            exit 1
          fi

      - name: Mint sscc-devops token for the meta repo
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SSCCOPS_DEPLOY_HISTORY_APP_ID }}
          private-key: ${{ secrets.SSCCOPS_DEPLOY_HISTORY_APP_KEY }}
          owner: SoongSilComputingClub
          repositories: ssccops

      # .env 모양의 조직 변수에서 이 레포 몫만 꺼낸다. CR·주석·빈 줄은 무시한다.
      - name: Load hosts from SSCCOPS_DEPLOY_HISTORY_ENV
        id: hosts
        env:
          DOTENV: ${{ vars.SSCCOPS_DEPLOY_HISTORY_ENV }}
        run: |
          set -euo pipefail
          DEV=''; PROD=''
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"; val="${line#*=}"
            key="$(printf '%s' "$key" | tr -d '[:space:]')"
            val="$(printf '%s' "$val" | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')"
            case "$key" in
              SERVER_DEV_URL)  DEV="${val%/}" ;;
              SERVER_PROD_URL) PROD="${val%/}" ;;
            esac
          done <<< "$DOTENV"
          [ -n "$DEV" ]  || echo "::warning::SSCCOPS_DEPLOY_HISTORY_ENV 에 SERVER_DEV_URL 이 없다 — dev 는 unverified 로 남는다"
          [ -n "$PROD" ] || echo "::warning::SSCCOPS_DEPLOY_HISTORY_ENV 에 SERVER_PROD_URL 이 없다 — prod 는 unverified 로 남는다"
          { echo "dev_url=$DEV"; echo "prod_url=$PROD"; } >> "$GITHUB_OUTPUT"

      # 환경·sha·버전·행위자·기준 URL 을 한 자리에서 정한다. 이벤트마다 오는 자리가 달라
      # 뒤 단계가 이벤트 종류를 다시 보지 않게 여기서 평평하게 편다.
      - name: Resolve target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          DEV_BASE_URL: ${{ steps.hosts.outputs.dev_url }}
          PROD_BASE_URL: ${{ steps.hosts.outputs.prod_url }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release)
              ENVIRONMENT=prod
              TAG="$RELEASE_TAG"
              SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
              ACTOR="$RELEASE_AUTHOR"
              ;;
            push)
              ENVIRONMENT=dev
              TAG=''
              SHA="$GITHUB_SHA"
              ACTOR="$GITHUB_ACTOR"
              ;;
            workflow_dispatch)
              ENVIRONMENT="$INPUT_ENV"
              ACTOR="$GITHUB_ACTOR"
              if [ "$ENVIRONMENT" = prod ]; then
                TAG="${INPUT_REF:-$(gh api "repos/$REPO/releases/latest" --jq .tag_name)}"
                SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
              else
                TAG=''
                SHA=$(gh api "repos/$REPO/commits/${INPUT_REF:-$GITHUB_SHA}" --jq .sha)
              fi
              ;;
            *) echo "::error::지원하지 않는 이벤트 $EVENT_NAME"; exit 1 ;;
          esac

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            # dev 는 태그가 없다 — build.gradle 의 version(다음 릴리스에 붙을 값)을 적는다
            VERSION=$(grep -oE "^version = '[^']+'" build.gradle | sed -E "s/^version = '([^']+)'/\1/")
          fi

          if [ "$ENVIRONMENT" = prod ]; then BASE_URL="$PROD_BASE_URL"; else BASE_URL="$DEV_BASE_URL"; fi

          {
            echo "environment=$ENVIRONMENT"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "actor=$ACTOR"
            echo "base_url=${BASE_URL%/}"
          } >> "$GITHUB_OUTPUT"
          echo "환경 $ENVIRONMENT · sha $SHA · 버전 $VERSION · 태그 ${TAG:-없음}"

      # 메타 레포의 이력 브랜치를 App 토큰으로 받는다. 없으면 orphan 으로 만든다.
      # 토큰은 create-github-app-token 이 마스킹해 두어 로그에 찍히지 않는다.
      - name: Checkout meta history branch
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${TOKEN}@github.com/${META_REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" "$HISTORY_BRANCH" >/dev/null 2>&1; then
            git clone -q --depth 1 --branch "$HISTORY_BRANCH" "$REMOTE" history
          else
            git init -q history
            git -C history remote add origin "$REMOTE"
            git -C history checkout -q --orphan "$HISTORY_BRANCH"
            cat > history/README.md <<'README'
          # deploy-history

          배포 이력 레코드 (ssccops#344 · ADR-0033). 개발 레포 두 곳의 `deploy-history.yml` 이 릴리스(prod)·develop
          푸시(dev)마다 JSON 한 줄을 `server-*.jsonl` / `web-*.jsonl` 에 append 한다. 손으로 고치지 않는다 —
          조회는 서버 레포의 `scripts/deploy-history.sh current|list <server|web> [prod|dev]`.
          README
            git -C history add README.md
          fi
          git -C history config user.name 'sscc-devops[bot]'
          git -C history config user.email '272459506+sscc-devops[bot]@users.noreply.github.com'

      - name: Find previous deployment
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE=''
          if [ "$ENVIRONMENT" = prod ]; then
            # 이 태그보다 먼저 게시된 릴리스 중 가장 최근 것. 초안·프리릴리스는 배포되지 않았으므로 뺀다
            BASE=$(gh api "repos/$REPO/releases?per_page=100" \
              | jq -r --arg tag "$TAG" \
                  '[.[] | select(.draft == false and .prerelease == false)]
                   | sort_by(.published_at) | reverse
                   | (map(.tag_name) | index($tag)) as $i
                   | if $i == null then empty else .[$i + 1:] | first | .tag_name // empty end' \
              | head -1 || true)
          else
            FILE="history/$SERVICE_KEY-$ENVIRONMENT.jsonl"
            if [ -s "$FILE" ]; then
              BASE=$(tail -n 1 "$FILE" | jq -r '.git_sha // empty')
            fi
            if [ -z "$BASE" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$EVENT_BEFORE"
            fi
          fi
          if [ "$BASE" = "$SHA" ]; then
            BASE=''
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "직전 지점: ${BASE:-없음(이 커밋 하나만 기록)}"

      - name: Collect PRs, issues and ADRs
        id: collect
        env:
          # App 토큰은 메타 레포 issues:read 가 있어 cross-repo Parent 와 그 본문의 ADR 을 직접 읽는다.
          # 그래도 못 읽으면(스크립트 안에서) PR 본문 «근거»로 보완한다
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.previous.outputs.base }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          # 수집이 죽어도 **레코드는 남긴다** (#564 · ssccops#486) — v0.2.16 이 여기서 통째로
          # 사라졌다. `set -e` 를 빼고 결과가 JSON 배열인지 직접 본다. 스크립트 안에서도 API
          # 실패는 경고로 지나가므로, 여기까지 오는 실패는 스크립트 자체가 깨진 경우다.
          if ! bash .github/scripts/deploy-history-collect.sh "$REPO" "$BASE" "$SHA" > prs.json \
            || ! jq -e 'type == "array"' prs.json >/dev/null 2>&1; then
            echo "::warning::PR 수집에 실패했다 — 레코드는 남기고 PR 목록만 비운다"
            echo '[]' > prs.json
          fi
          echo "count=$(jq length prs.json)" >> "$GITHUB_OUTPUT"
          jq . prs.json

      - name: Verify deployment via /actuator/info
        id: verify
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          SHA: ${{ steps.target.outputs.sha }}
        run: bash .github/scripts/deploy-history-verify.sh "$BASE_URL" "$SHA" "$VERIFY_TIMEOUT_SECONDS"

      - name: Append record and push
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
          ACTOR: ${{ steps.target.outputs.actor }}
          STATUS: ${{ steps.verify.outputs.status }}
          DEPLOYED_AT: ${{ steps.verify.outputs.deployed_at }}
          BUILD_TIME: ${{ steps.verify.outputs.build_time }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          RECORD=$(jq -c -n \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployed_at "$DEPLOYED_AT" \
            --arg environment "$ENVIRONMENT" \
            --arg service "$SERVICE" \
            --arg version "$VERSION" \
            --arg git_sha "$SHA" \
            --arg build_time "$BUILD_TIME" \
            --slurpfile prs prs.json \
            --arg actor "$ACTOR" \
            --arg workflow_run_url "$RUN_URL" \
            --arg status "$STATUS" \
            '{recorded_at: $recorded_at,
              deployed_at: (if $deployed_at == "" then null else $deployed_at end),
              environment: $environment, service: $service, version: $version, git_sha: $git_sha,
              build_time: (if $build_time == "" then null else $build_time end),
              prs: $prs[0], actor: $actor, workflow_run_url: $workflow_run_url, status: $status}')
          printf '%s\n' "$RECORD" | jq .

          FILE="$SERVICE_KEY-$ENVIRONMENT.jsonl"
          MSG="record($SERVICE_KEY/$ENVIRONMENT): $VERSION $(echo "$SHA" | cut -c1-7) $STATUS"
          # 웹 레포의 같은 워크플로가 같은 브랜치에 쓴다 — 밀리면 다시 받아서 다시 붙인다(다른 파일이라 충돌은 없다)
          for attempt in 1 2 3 4 5; do
            printf '%s\n' "$RECORD" >> "history/$FILE"
            if (cd history && git add -A && git commit -q -m "$MSG" && git push -q origin "HEAD:$HISTORY_BRANCH"); then
              echo "appended → $META_REPO@$HISTORY_BRANCH/$FILE"
              exit 0
            fi
            echo "push 거절 — 다시 받아서 재시도 ($attempt)"
            (cd history && git reset -q --hard && git fetch -q origin "$HISTORY_BRANCH" && git reset -q --hard FETCH_HEAD)
            sleep $((attempt * 5))
          done
          echo "::error::$META_REPO 의 $HISTORY_BRANCH 브랜치에 push 하지 못했다"
          exit 1

      - name: Summary
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
          STATUS: ${{ steps.verify.outputs.status }}
          DEPLOYED_AT: ${{ steps.verify.outputs.deployed_at }}
          COUNT: ${{ steps.collect.outputs.count }}
        run: |
          {
            echo "## Deploy History ($SERVICE_KEY · $ENVIRONMENT) → $META_REPO@$HISTORY_BRANCH"
            echo "- **version** : $VERSION"
            echo "- **sha** : $SHA"
            echo "- **status** : $STATUS ${DEPLOYED_AT:+(deployed_at $DEPLOYED_AT)}"
            echo "- **PRs** : $COUNT"
            echo
            echo '| PR | 제목 | Sub-task | Parent | ADR |'
            echo '|---|---|---|---|---|'
            jq -r '.[] | "| #\(.number) | \(.title | gsub("\\|"; "\\\\|")) | \(.issue // "-") | \(.parent_issue // "-") | \(.adr_refs | join(", ")) |"' prs.json
          } >> "$GITHUB_STEP_SUMMARY"
