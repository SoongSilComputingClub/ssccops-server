# 테스트 ApplicationContext 캐시 상한 (Spring 기본값 32).
#
# 이 레포는 테스트 클래스마다 자기 몫의 @TestConfiguration(StubJwtDecoderConfig)을 두므로
# 컨텍스트가 클래스 수만큼 늘어난다. 상한을 넘으면 Spring이 LRU로 컨텍스트를 **닫는데**,
# 프로필 설정이 ddl-auto: create-drop이라 컨텍스트가 닫히는 순간 공용 H2(jdbc:h2:mem:testdb)의
# 스키마가 통째로 사라진다. 그러면 아직 캐시에 남아 있는 다른 컨텍스트로 도는 테스트가
# 'Table "MBR_GRD" not found (this database is empty)'로 깨진다 — 어느 클래스가 깨지는지는
# 실행 순서에 따라 매번 달라져 원인을 찾기 어렵다.
#
# 근본 해법은 스텁 설정을 한 곳으로 모아 컨텍스트를 합치는 것이지만 테스트 전량을 건드려야
# 하므로, 우선 상한을 올려 이 실패 방식을 없앤다.
spring.test.context.cache.maxSize=64
