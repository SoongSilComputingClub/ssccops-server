# ============================================================================
# Backend Integration Workflow - Dev
# ============================================================================
# 역할:
#   - 소스 코드 정적 분석 (Spotless, Checkstyle)
#   - 테스트 수행 및 JaCoCo 커버리지 생성
#   - SonarQube 분석 (develop 푸시에서만 · 토큰이 있을 때만 · 아무것도 막지 않는다)
#   - JAR 빌드 검증 (bootJar 가 깨지지 않는지만 본다 — 배포는 Coolify 몫이다)
#   - OpenAPI 하위 호환 게이트 (PR 에서만 · oasdiff · 라벨 api-breaking-approved 로 예외, ssccops#342)
#
# Job 구조:
#   lint ──┬──> build
#          ├──> analyze   (develop push 에서만)
#   test ──┘
#   api-compat            (PR 에서만 · 독립 — OpenAPI 하위 호환 게이트, #412)
#
#   analyze 는 build 를 막지 않는다. 코드 품질 리포트가 없다고 해서 "이 브랜치가
#   빌드되는가"라는 판정까지 함께 막을 이유가 없다 (ssccops-web integrate.yml 과 같은 판단).
#
# 대상 브랜치: develop (dev 환경)
#
# **분석은 이 워크플로의 develop 푸시에만 있다** (ssccops#238).
#   ssccops#231은 PR에서 돌렸다 — "병합 전에 보는 편이 리뷰에 붙어 쓸모 있다"는 판단이었다.
#   그 판단이 이 서버에서는 성립하지 않는다: SonarQube Community Build 26.8.0 이고 브랜치
#   플러그인이 없어(ssccops#234) 스캐너가 브랜치를 선언하지 못하고, **모든 분석이 프로젝트
#   기본 브랜치 한 자리를 덮어쓴다.** PR마다 돌리면 그 자리가 PR 내용으로 바뀌어
#   **"지금 develop이 어떤 상태인가"를 아무도 알 수 없다.**
#
#   그래서 머지된 상태만 분석한다. 잃는 것은 머지 전 피드백이고, 얻는 것은 언제 봐도
#   develop 을 가리키는 수치다 — 그것이 있어야 Quality Gate 를 잠글 기준이 생긴다.
#   integrate-prod 의 analyze 는 같은 이유로 **걷어냈다**(develop 과 main 이 같은 자리를
#   덮어써 수치가 오간다. develop 이 항상 앞서므로 이쪽을 남긴다).
#
#   그 외 lint/test 실행 방식은 integrate-prod와 동일하게 맞춘다 —
#   두 워크플로가 다른 명령을 쓰면 develop에서 통과한 코드가 main에서 떨어진다.
#
# GitHub Secrets (없으면 analyze 를 건너뛴다):
#   - SONAR_TOKEN        : SonarQube Token
#   - SONAR_HOST_URL     : SonarQube Server URL
# ============================================================================

name: Integrate Dev

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

env:
  JAVA_VERSION: '17'

jobs:
  # ==========================================================================
  # Lint Job - 코드 스타일 검사
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  # ==========================================================================
  # Test Job - 테스트 및 커버리지
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Tests with JaCoCo
        run: ./gradlew test jacocoTestReport

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: ignore

  # ==========================================================================
  # API Compat Job - OpenAPI 하위 호환 게이트 (PR에서만 · #412 · ssccops#342)
  # ==========================================================================
  #
  # API 계약을 깨는 변경(응답 필드 삭제·이름·타입 변경, 요청 필드 필수화, 엔드포인트·enum 값 삭제)을
  # 병합 전에 기계가 잡는다 — ssccops#305(서버·웹 계약 어긋남)가 이 종류였다. 추가(필드·엔드포인트·
  # 선택 파라미터)는 통과한다.
  #
  # 스펙은 커밋하지 않는다 — base 와 head 를 각각 체크아웃해 OpenApiSnapshotTest 하나로 build/openapi.json
  # 을 만들고 oasdiff 로 비교한다. 레포에 스펙을 두고 diff 하면 매 PR 마다 손으로 갱신해야 하고 잊으면
  # 게이트가 빈다. 생성이 곧 정본이다.
  #
  # 심각도는 config/oasdiff/severity-levels.txt 가 덮어쓴다 — springdoc 스펙에는 required 가 없어 기본값으로는
  # 응답 필드 삭제가 info 라 아무것도 막히지 않는다(그 디렉터리의 README).
  #
  # 라벨 `api-breaking-approved` 가 붙어 있으면 결과를 요약에만 남기고 실패시키지 않는다. 라벨은
  # **실행 시점에** gh 로 읽으므로 라벨을 붙인 뒤 `gh run rerun <id> --failed` 면 된다(pull_request 의 기본
  # 트리거에 labeled 가 없고, 넣으면 라벨 하나에 lint·test·build 가 전부 다시 돈다).
  #
  # develop→main 릴리스 PR·dependabot 은 면제(pr-guard 와 같은 규칙). base 에 OpenApiSnapshotTest 가 없으면
  # (이 게이트를 들이는 PR 자신) 비교할 것이 없어 건너뛴다.
  api-compat:
    name: API Compat
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'develop' &&
      !startsWith(github.head_ref, 'dependabot/')

    permissions:
      contents: read
      pull-requests: read

    env:
      OASDIFF_VERSION: '1.32.0'
      SNAPSHOT_TEST: src/test/java/org/sscc/ssccopsserver/global/config/OpenApiSnapshotTest.java

    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # 러너는 리눅스다 — GitHub Release 의 바이너리를 받는다. docker:// 액션은 매 실행에 이미지를 끌어와
      # 더 느리고, 이 바이너리 하나면 된다.
      - name: Install oasdiff
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oasdiff"
          curl -sSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/oasdiff/oasdiff" --version

      - name: Generate base spec
        id: base
        working-directory: base
        run: |
          set -euo pipefail
          if [ ! -f "$SNAPSHOT_TEST" ]; then
            echo "base 에 OpenApiSnapshotTest 가 없다 — 비교할 스펙이 없어 건너뛴다" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x gradlew
          ./gradlew test --tests '*OpenApiSnapshotTest' --no-daemon -q
          mv build/openapi.json ../base.json
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Generate head spec
        if: steps.base.outputs.skip == 'false'
        working-directory: head
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew test --tests '*OpenApiSnapshotTest' --no-daemon -q
          mv build/openapi.json ../head.json

      - name: Compare (oasdiff breaking)
        if: steps.base.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          SEVERITY=head/config/oasdiff/severity-levels.txt
          oasdiff breaking base.json head.json --fail-on ERR --severity-levels "$SEVERITY" -f markup > report.md
          RC=$?
          oasdiff breaking base.json head.json --fail-on ERR --severity-levels "$SEVERITY" || true

          APPROVED=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq '[.labels[].name] | index("api-breaking-approved") != null')

          {
            echo "## API Compat (oasdiff breaking)"
            echo "- base \`${{ github.event.pull_request.base.sha }}\` → head \`${{ github.event.pull_request.head.sha }}\`"
            if [ "$RC" -eq 0 ]; then
              echo "- ✅ 깨는 변경 없음"
            elif [ "$APPROVED" = true ]; then
              echo "- ⚠️ 깨는 변경이 있으나 \`api-breaking-approved\` 라벨로 통과 — 마이너 버전업 + 릴리스 노트 마이그레이션 항목이 필요하다"
            else
              echo "- ❌ 깨는 변경 — 의도한 것이면 \`api-breaking-approved\` 라벨을 붙이고 이 job 을 다시 돌린다(\`gh run rerun <id> --failed\`)"
            fi
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RC" -ne 0 ] && [ "$APPROVED" != true ]; then
            echo "::error::OpenAPI 하위 호환이 깨졌다. 의도한 변경이면 라벨 api-breaking-approved 를 붙이고 job 을 다시 돌린다."
            exit 1
          fi

  # ==========================================================================
  # Analyze Job - SonarQube 분석 (PR에서만 · 토큰이 없으면 건너뛴다)
  # ==========================================================================
  #
  # `if: github.event_name == 'pull_request'` 로 push 를 제외한다. develop 푸시마다
  # 돌리면 dev 배포가 느려지는데, 그것이 원래 이 워크플로에 analyze 가 없던 이유다.
  #
  # 토큰 가드가 있는 이유: v0.2.1 릴리스까지 다섯 번의 Analyze 가 전부 "실패"였고 원인은
  # 언제나 빈 SONAR_TOKEN 이었다(시크릿이 릴리스보다 2시간 뒤에 등록됐다). 설정이 없는 것과
  # 품질이 나쁜 것은 다른 일인데 같은 빨간 X 로 보고되면 아무도 그 X 를 읽지 않게 된다.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    permissions:
      contents: read

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN이 설정되지 않아 SonarQube 분석을 건너뜁니다." >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 얕은 클론이면 blame·신규 코드 판정이 어긋난다

      - name: Set up JDK
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 이름으로 받는다 — download-artifact v5 가 깨뜨린 것은 `artifact-ids` 로 받는 경로뿐이다.
      # v8 부터 다이제스트 불일치가 경고가 아니라 실패다(`digest-mismatch` 기본값 error).
      # 업로드가 zip 그대로이므로(upload-artifact v7 의 `archive: false` 를 쓰지 않는다)
      # 여기서 압축을 푸는 흐름도 그대로다.
      - name: Download test results
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-results
          path: build/

      - name: Grant execution to Gradle wrapper
        if: env.SONAR_TOKEN != ''
        run: chmod +x gradlew

      # sonar 는 컴파일된 클래스를 읽는다(sonar.java.binaries). test job 이 만든 것은
      # 커버리지 리포트뿐이라 여기서 다시 컴파일한다.
      - name: Compile classes for SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew compileJava

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --info

      - name: Quality Gate report
        if: env.SONAR_TOKEN != ''
        env:
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/sonar-report.sh

  # ==========================================================================
  # Build Job - JAR 빌드 및 Artifact 업로드
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar

      - name: Integration Summary
        run: |
          echo "## Integration Summary (Dev)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
