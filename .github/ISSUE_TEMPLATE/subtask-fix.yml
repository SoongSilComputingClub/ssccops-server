name: "🧩 Fix"
description: "결함 수정 및 기타 수정"
title: "[FIX] "
labels: ["fix"]
type: SubTask
body:
  - type: markdown
    attributes:
      value: |
        제목 앞 `[FIX]`를 **지우지 마세요.** 이 접두사로 브랜치(`fix/#번호-...`)와 라벨이 자동 생성됩니다.
        원인 분석이 `ssccops`의 Bug 이슈에 있으면 상단 **Parent issue**로 연결하세요.

  - type: textarea
    id: description
    attributes:
      label: 📄 설명
      description: |
        **무엇이 잘못됐고 왜 그런지.** 증상만 적으면 고치는 사람이 원인을 다시 찾습니다.
        원인 분석이 상위 Bug 이슈에 있으면 요약하고 링크하세요.
      placeholder: |
        시드가 회원이 없으면 건너뛰고 그 뒤 재기동 전까지 세워지지 않는다. `data.sql`이 회원을
        시드하지 않으므로 갓 만든 DB의 첫 기동은 언제나 건너뛴다. 시스템 폼을 세우는 경로가
        `designateAsSystemForm` 하나뿐이라 화면·API로 만들 수도 없어 재기동 외에 복구 수단이 없다.
        원인 분석은 상위 이슈에 있다.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: ✅ 작업 항목
      description: 무엇을 고치면 끝나는가. 체크박스로 씁니다.
      value: |
        - [ ]
        - [ ]
      placeholder: |
        - [ ] 회원 생성 커밋 직후에도 시드를 태운다
        - [ ] 건너뛸 때 `log.info` → `log.warn`
        - [ ] 회귀 테스트: 회원 0명 → 첫 가입 → 재기동 없이 폼이 선다
    validations:
      required: true

  - type: textarea
    id: rejected
    attributes:
      label: 🚫 검토했으나 택하지 않은 길
      description: |
        같은 제보가 다시 올라오는 것을 막는 칸입니다. **"왜 그 뻔한 방법으로 안 고쳤나"에 대한 답**을
        여기 남기세요. 아직 대안을 안 따져봤으면 비워 둡니다.
      placeholder: |
        | 후보 | 왜 안 되는가 |
        |---|---|
        | `data-local.sql`에 로컬 전용 회원 시드 | 최초 가입자 부트스트랩이 `mbr` 건수 0으로 판정한다 — 유령 회원 하나에 창구가 닫힌 채 뜬다 |
    validations:
      required: false

  - type: textarea
    id: precheck
    attributes:
      label: 🔍 먼저 확인할 것
      description: 착수 전에 실측이 필요한 것. 결과에 따라 작업 범위가 달라지는 항목만 씁니다.
      placeholder: |
        - [ ] dev에도 재현되는가 — 재현되면 배포 전 임시 조치가 먼저다
    validations:
      required: false

  - type: textarea
    id: ddl
    attributes:
      label: 🗄 배포 전 수동 DDL
      description: |
        **`dev`·`prod`는 `ddl-auto: update`라 컬럼 삭제·이름 변경·타입 변경·제약 변경을 반영하지 않습니다.**
        그런 변경이 있으면 배포 전에 실행할 SQL을 여기 적으세요. 해당 없으면 비워 둡니다.
      render: sql
      placeholder: |
        ALTER TABLE mbr ALTER COLUMN stdnt_no DROP NOT NULL;
    validations:
      required: false

  - type: textarea
    id: refs
    attributes:
      label: 🙋🏻 참고 자료
      description: 상위 Bug 이슈, 관련 코드 경로, 재발 방지 근거.
      placeholder: |
        - 상위: SoongSilComputingClub/ssccops#152
        - `domain/form/service/ProposalFormSeeder.java`
    validations:
      required: false
