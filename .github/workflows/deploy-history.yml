name: Deploy History

# 배포 이력을 파이프라인이 남긴다 (#410 · ssccops#340 · Epic ssccops#338).
#
# «어느 환경에 어떤 커밋이 언제 올라갔고 무엇이 들었나»에 답하는 자리가 없었다 — 태그·릴리스
# 노트(사람이 씀)·Coolify 배포 화면·/actuator/info 가 흩어져 있고 어느 것도 «실제로 떴다»와
# «무슨 PR이 들었다»를 한 줄로 잇지 못했다. 이 워크플로는 **배포 주체를 바꾸지 않는다** —
# Coolify 가 develop 푸시를 dev 로, main 푸시(릴리스)를 prod 로 자동 배포하는 것은 그대로이고
# (#202), 그 이벤트에 «기록만» 얹는다. 손으로 쓰는 칸은 없다.
#
# 무엇을 하나:
#   1. 직전 배포 지점을 찾는다 — prod 는 직전 GitHub Release 의 태그, dev 는 dev.jsonl 마지막
#      레코드의 sha(없으면 push 이벤트의 before)
#   2. compare 로 사이의 커밋 → PR 번호·제목 → 제목의 [#N] Sub-task → cross-repo Parent(메타
#      이슈) → Parent 본문의 ADR-NNNN 을 취합한다 (.github/scripts/deploy-history-collect.sh)
#   3. /actuator/info 를 최대 10분 폴링해 git.commit.id 가 이 sha 와 같아지면 deployed, 아니면
#      status: unverified 로 남긴다 (.github/scripts/deploy-history-verify.sh). «배포됨»은 실제
#      응답으로만 확인한다 — 태그는 사람이 올린 값이라 증빙이 못 된다
#   4. JSON 한 줄을 orphan 브랜치 deploy-history 의 prod.jsonl / dev.jsonl 에 append 하고 푸시한다
#
# 저장 위치가 이 레포의 orphan 브랜치인 이유: GITHUB_TOKEN 만으로 쓸 수 있고, develop·main
# 이력을 더럽히지 않으며, PR 절차(pr-guard)와 부딪히지 않는다. 메타 레포로 모으는 안은 교차
# 레포 PAT 시크릿이 필요해 기각했다 — 조회 스크립트(scripts/deploy-history.sh)가 브랜치를 읽으면
# 같은 답이 나온다.
#
# 호스트를 여기 적지 않는다. 배포 주소는 repo variables 다:
#   DEV_APP_PUBLIC_BASE_URL  · PROD_APP_PUBLIC_BASE_URL  (예: https://api.example.org — 끝 슬래시 없이)
# 비어 있으면 폴링을 건너뛰고 unverified 로 남긴다(워크플로는 실패하지 않는다 — 기록은 남아야 한다).
#
# 한계 — 메타 레포(ssccops)가 private 이라 GITHUB_TOKEN 으로는 cross-repo Parent 를 못 읽는다.
# 그때 parent_issue·adr_refs 는 null 로 남는다. 읽으려면 그 레포 read 권한이 있는 토큰을
# secrets.DEPLOY_HISTORY_TOKEN 으로 넣으면 되지만 **필수는 아니다**(있으면 쓰고 없으면 GITHUB_TOKEN).
# image digest 는 Coolify 가 밖으로 내지 않아 싣지 않는다.

on:
  release:
    types: [published]
  push:
    branches: [develop]
  # 실제 이벤트 전에는 돌려 볼 수 없어 수동 실행을 열어 둔다. dev 에서 한 번 돌려 레코드가
  # 붙는지 확인하는 용도이며, ref 를 주면 그 커밋(prod 면 태그)을 기록한다.
  workflow_dispatch:
    inputs:
      environment:
        description: 기록할 환경
        type: choice
        options: [dev, prod]
        default: dev
      ref:
        description: 기록할 커밋 sha(dev) 또는 릴리스 태그(prod). 비우면 지금 ref
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: read
  issues: read

# 두 이벤트가 겹쳐도 브랜치 append 가 꼬이지 않게 직렬화한다. 취소하지 않는다 — 기록은 전부 남는다.
concurrency:
  group: deploy-history
  cancel-in-progress: false

env:
  SERVICE: ssccops-server
  HISTORY_BRANCH: deploy-history
  VERIFY_TIMEOUT_SECONDS: '600'

jobs:
  record:
    name: Record
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # 환경·sha·버전·행위자·기준 URL 을 한 자리에서 정한다. 이벤트마다 오는 자리가 달라
      # 뒤 단계가 이벤트 종류를 다시 보지 않게 여기서 평평하게 편다.
      - name: Resolve target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          DEV_BASE_URL: ${{ vars.DEV_APP_PUBLIC_BASE_URL }}
          PROD_BASE_URL: ${{ vars.PROD_APP_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release)
              ENVIRONMENT=prod
              TAG="$RELEASE_TAG"
              SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
              ACTOR="$RELEASE_AUTHOR"
              ;;
            push)
              ENVIRONMENT=dev
              TAG=''
              SHA="$GITHUB_SHA"
              ACTOR="$GITHUB_ACTOR"
              ;;
            workflow_dispatch)
              ENVIRONMENT="$INPUT_ENV"
              ACTOR="$GITHUB_ACTOR"
              if [ "$ENVIRONMENT" = prod ]; then
                TAG="${INPUT_REF:-$(gh api "repos/$REPO/releases/latest" --jq .tag_name)}"
                SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
              else
                TAG=''
                SHA=$(gh api "repos/$REPO/commits/${INPUT_REF:-$GITHUB_SHA}" --jq .sha)
              fi
              ;;
            *) echo "::error::지원하지 않는 이벤트 $EVENT_NAME"; exit 1 ;;
          esac

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            # dev 는 태그가 없다 — build.gradle 의 version(다음 릴리스에 붙을 값)을 적는다
            VERSION=$(grep -oE "^version = '[^']+'" build.gradle | sed -E "s/^version = '([^']+)'/\1/")
          fi

          if [ "$ENVIRONMENT" = prod ]; then BASE_URL="$PROD_BASE_URL"; else BASE_URL="$DEV_BASE_URL"; fi
          if [ -z "$BASE_URL" ]; then
            echo "::warning::repo variable ${ENVIRONMENT^^}_APP_PUBLIC_BASE_URL 이 비어 있다 — 배포 확인을 건너뛰고 unverified 로 남긴다"
          fi

          {
            echo "environment=$ENVIRONMENT"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "actor=$ACTOR"
            echo "base_url=${BASE_URL%/}"
          } >> "$GITHUB_OUTPUT"
          echo "환경 $ENVIRONMENT · sha $SHA · 버전 $VERSION · 태그 ${TAG:-없음}"

      # 이력 브랜치를 별도 worktree 로 받는다. 없으면 orphan 으로 만든다 — develop·main 과
      # 조상을 공유하지 않아야 이력 커밋이 배포 브랜치 로그에 섞이지 않는다.
      - name: Checkout history branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$HISTORY_BRANCH"
            git worktree add history FETCH_HEAD
            git -C history checkout -B "$HISTORY_BRANCH"
          else
            git worktree add --detach history
            git -C history checkout --orphan "$HISTORY_BRANCH"
            git -C history rm -rfq .
            cat > history/README.md <<'EOF'
          # deploy-history

          배포 이력 레코드. `.github/workflows/deploy-history.yml` 이 릴리스(prod)·develop 푸시(dev)마다
          JSON 한 줄을 `prod.jsonl` / `dev.jsonl` 에 append 한다. 손으로 고치지 않는다 —
          조회는 `scripts/deploy-history.sh current|list [prod|dev]`.
          EOF
            git -C history add README.md
          fi
          git -C history config user.name github-actions[bot]
          git -C history config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Find previous deployment
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE=''
          if [ "$ENVIRONMENT" = prod ]; then
            # 이 태그보다 먼저 게시된 릴리스 중 가장 최근 것. 초안·프리릴리스는 배포되지 않았으므로 뺀다
            BASE=$(gh api "repos/$REPO/releases?per_page=100" \
              | jq -r --arg tag "$TAG" \
                  '[.[] | select(.draft == false and .prerelease == false)]
                   | sort_by(.published_at) | reverse
                   | (map(.tag_name) | index($tag)) as $i
                   | if $i == null then empty else .[$i + 1:] | first | .tag_name // empty end' \
              | head -1 || true)
          else
            FILE="history/$ENVIRONMENT.jsonl"
            if [ -s "$FILE" ]; then
              BASE=$(tail -n 1 "$FILE" | jq -r '.git_sha // empty')
            fi
            if [ -z "$BASE" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$EVENT_BEFORE"
            fi
          fi
          if [ "$BASE" = "$SHA" ]; then
            BASE=''
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "직전 지점: ${BASE:-없음(이 커밋 하나만 기록)}"

      - name: Collect PRs, issues and ADRs
        id: collect
        env:
          # 메타 레포가 private 이라 GITHUB_TOKEN 으로는 Parent 를 못 읽는다. 선택 시크릿이 있으면 쓴다
          GH_TOKEN: ${{ secrets.DEPLOY_HISTORY_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.previous.outputs.base }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-history-collect.sh "$REPO" "$BASE" "$SHA" > prs.json
          echo "count=$(jq length prs.json)" >> "$GITHUB_OUTPUT"
          jq . prs.json

      - name: Verify deployment via /actuator/info
        id: verify
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          SHA: ${{ steps.target.outputs.sha }}
        run: bash .github/scripts/deploy-history-verify.sh "$BASE_URL" "$SHA" "$VERIFY_TIMEOUT_SECONDS"

      - name: Append record and push
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
          ACTOR: ${{ steps.target.outputs.actor }}
          STATUS: ${{ steps.verify.outputs.status }}
          DEPLOYED_AT: ${{ steps.verify.outputs.deployed_at }}
          BUILD_TIME: ${{ steps.verify.outputs.build_time }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          FILE="history/$ENVIRONMENT.jsonl"
          jq -c -n \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployed_at "$DEPLOYED_AT" \
            --arg environment "$ENVIRONMENT" \
            --arg service "$SERVICE" \
            --arg version "$VERSION" \
            --arg git_sha "$SHA" \
            --arg build_time "$BUILD_TIME" \
            --slurpfile prs prs.json \
            --arg actor "$ACTOR" \
            --arg workflow_run_url "$RUN_URL" \
            --arg status "$STATUS" \
            '{recorded_at: $recorded_at,
              deployed_at: (if $deployed_at == "" then null else $deployed_at end),
              environment: $environment, service: $service, version: $version, git_sha: $git_sha,
              build_time: (if $build_time == "" then null else $build_time end),
              prs: $prs[0], actor: $actor, workflow_run_url: $workflow_run_url, status: $status}' \
            >> "$FILE"
          tail -n 1 "$FILE"

          git -C history add "$ENVIRONMENT.jsonl"
          git -C history commit -q -m "record($ENVIRONMENT): $VERSION $(echo "$SHA" | cut -c1-7) $STATUS"
          # 릴리스와 develop 푸시가 거의 동시에 오면 concurrency 가 직렬화하지만, 그래도 밀리면 한 번 더
          for attempt in 1 2 3; do
            if git -C history push origin "HEAD:$HISTORY_BRANCH"; then break; fi
            [ "$attempt" = 3 ] && exit 1
            git -C history pull --rebase origin "$HISTORY_BRANCH"
          done

      - name: Summary
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
          STATUS: ${{ steps.verify.outputs.status }}
          DEPLOYED_AT: ${{ steps.verify.outputs.deployed_at }}
          COUNT: ${{ steps.collect.outputs.count }}
        run: |
          {
            echo "## Deploy History ($ENVIRONMENT)"
            echo "- **version** : $VERSION"
            echo "- **sha** : $SHA"
            echo "- **status** : $STATUS ${DEPLOYED_AT:+(deployed_at $DEPLOYED_AT)}"
            echo "- **PRs** : $COUNT"
            echo
            echo '| PR | 제목 | Sub-task | Parent | ADR |'
            echo '|---|---|---|---|---|'
            jq -r '.[] | "| #\(.number) | \(.title | gsub("\\|"; "\\\\|")) | \(.issue // "-") | \(.parent_issue // "-") | \(.adr_refs | join(", ")) |"' prs.json
          } >> "$GITHUB_STEP_SUMMARY"
