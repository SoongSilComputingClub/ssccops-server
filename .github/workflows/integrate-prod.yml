# ============================================================================
# Backend Integration Workflow - Production
# ============================================================================
# 역할:
#   - 소스 코드 정적 분석 (Spotless, Checkstyle)
#   - 테스트 수행 및 JaCoCo 커버리지 생성
#   - SonarQube 코드 품질/커버리지/보안 분석 (토큰이 있을 때만 · 아무것도 막지 않는다)
#   - JAR 빌드 검증 (bootJar 가 깨지지 않는지만 본다 — 배포는 Coolify 몫이다)
#
# Job 구조:
#   lint ──┬──> build
#          ├──> analyze
#   test ──┘
#
#   **analyze 는 build 를 막지 않는다** (ssccops#231). 예전에는 build 가 analyze 에 걸려
#   있었고 analyze 는 Quality Gate 실패에 exit 1 했는데, 정작 다섯 번의 릴리스에서 그 job 을
#   실패시킨 것은 품질이 아니라 **빈 SONAR_TOKEN** 이었다. 그 동안 JAR 빌드 검증은
#   `Build: skipped` 로 한 번도 돌지 않았다 — 막으려던 것은 안 막고 엉뚱한 것을 막았다.
#   Quality Gate 는 리포트로만 남긴다. 기준을 정한 뒤에 잠근다.
#
# 대상 브랜치: main (production 환경)
#
# GitHub Secrets (없으면 analyze 를 건너뛴다):
#   - SONAR_TOKEN        : SonarQube Token
#   - SONAR_HOST_URL     : SonarQube Server URL (e.g., https://sonar.example.com)
# ============================================================================

name: Integrate Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  JAVA_VERSION: '17'

jobs:
  # ==========================================================================
  # Lint Job - 코드 스타일 검사
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  # ==========================================================================
  # Test Job - 테스트 및 커버리지
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Tests with JaCoCo
        run: ./gradlew test jacocoTestReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: ignore

  # ==========================================================================
  # Analyze Job - SonarQube 분석
  # ==========================================================================
  # 토큰 가드가 있는 이유: v0.2.1 릴리스까지 다섯 번의 Analyze 가 전부 "실패"였고 원인은
  # 언제나 빈 SONAR_TOKEN 이었다(시크릿이 릴리스보다 2시간 뒤에 등록됐다). 그리고 build 가
  # 이 job 에 걸려 있어 **JAR 빌드 검증이 매번 통째로 건너뛰어졌다** — 릴리스에서도 그랬다.
  # 설정이 없는 것과 품질이 나쁜 것은 다른 일이고, 둘 다 배포 판정을 막을 이유는 없다.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      contents: read
      pull-requests: write

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN이 설정되지 않아 SonarQube 분석을 건너뜁니다." >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 분석을 위해 전체 히스토리 필요

      - name: Set up JDK
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download test results
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: build/

      - name: Grant execution to Gradle wrapper
        if: env.SONAR_TOKEN != ''
        run: chmod +x gradlew

      - name: Compile classes for SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew compileJava

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --info

      - name: Quality Gate report
        if: env.SONAR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash .github/scripts/sonar-report.sh

  # ==========================================================================
  # Build Job - JAR 빌드 및 Artifact 업로드
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar

      - name: Integration Summary
        run: |
          echo "## Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY