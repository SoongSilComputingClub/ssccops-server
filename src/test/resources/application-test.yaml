spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  security:
    oauth2:
      resourceserver:
        jwt:
          # 테스트는 SecurityMockMvcRequestPostProcessors.jwt()로 디코더를 우회하므로 실제 네트워크 호출 없음
          jwk-set-uri: http://localhost/auth/v1/.well-known/jwks.json
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

# Frontend Configuration (CORS 허용 오리진)
frontend:
  url: http://localhost:5173
