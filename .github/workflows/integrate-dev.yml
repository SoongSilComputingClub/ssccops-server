# ============================================================================
# Backend Integration Workflow - Dev
# ============================================================================
# 역할:
#   - 소스 코드 정적 분석 (Spotless, Checkstyle)
#   - 테스트 수행 및 JaCoCo 커버리지 생성
#   - SonarQube 분석 (PR에서만 · 토큰이 있을 때만 · 아무것도 막지 않는다)
#   - JAR 빌드 검증 (bootJar 가 깨지지 않는지만 본다 — 배포는 Coolify 몫이다)
#
# Job 구조:
#   lint ──┬──> build
#          ├──> analyze   (pull_request 에서만)
#   test ──┘
#
#   analyze 는 build 를 막지 않는다. 코드 품질 리포트가 없다고 해서 "이 브랜치가
#   빌드되는가"라는 판정까지 함께 막을 이유가 없다 (ssccops-web integrate.yml 과 같은 판단).
#
# 대상 브랜치: develop (dev 환경)
#
# integrate-prod와의 차이:
#   - **push 에는 analyze 가 붙지 않는다.** "dev는 배포 속도가 우선"이라 develop 푸시마다
#     분석을 돌리지 않는다 — 그 판단은 그대로다. 다만 그것은 **푸시에 대한 판단**이고,
#     PR은 배포 경로가 아니라 리뷰 경로다. 병합 전에 보는 편이 리뷰에 붙어 쓸모 있고,
#     릴리스 직전에 수백 건이 한꺼번에 드러나는 것을 막는다 (ssccops#231).
#   - 그 외 lint/test 실행 방식은 integrate-prod와 동일하게 맞춘다 —
#     두 워크플로가 다른 명령을 쓰면 develop에서 통과한 코드가 main에서 떨어진다.
#     Quality Gate 리포트도 같은 스크립트(.github/scripts/sonar-report.sh)를 함께 쓴다.
#
# GitHub Secrets (없으면 analyze 를 건너뛴다):
#   - SONAR_TOKEN        : SonarQube Token
#   - SONAR_HOST_URL     : SonarQube Server URL
# ============================================================================

name: Integrate Dev

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

env:
  JAVA_VERSION: '17'

jobs:
  # ==========================================================================
  # Lint Job - 코드 스타일 검사
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  # ==========================================================================
  # Test Job - 테스트 및 커버리지
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Tests with JaCoCo
        run: ./gradlew test jacocoTestReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: ignore

  # ==========================================================================
  # Analyze Job - SonarQube 분석 (PR에서만 · 토큰이 없으면 건너뛴다)
  # ==========================================================================
  #
  # `if: github.event_name == 'pull_request'` 로 push 를 제외한다. develop 푸시마다
  # 돌리면 dev 배포가 느려지는데, 그것이 원래 이 워크플로에 analyze 가 없던 이유다.
  #
  # 토큰 가드가 있는 이유: v0.2.1 릴리스까지 다섯 번의 Analyze 가 전부 "실패"였고 원인은
  # 언제나 빈 SONAR_TOKEN 이었다(시크릿이 릴리스보다 2시간 뒤에 등록됐다). 설정이 없는 것과
  # 품질이 나쁜 것은 다른 일인데 같은 빨간 X 로 보고되면 아무도 그 X 를 읽지 않게 된다.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN이 설정되지 않아 SonarQube 분석을 건너뜁니다." >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 얕은 클론이면 blame·신규 코드 판정이 어긋난다

      - name: Set up JDK
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download test results
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: build/

      - name: Grant execution to Gradle wrapper
        if: env.SONAR_TOKEN != ''
        run: chmod +x gradlew

      # sonar 는 컴파일된 클래스를 읽는다(sonar.java.binaries). test job 이 만든 것은
      # 커버리지 리포트뿐이라 여기서 다시 컴파일한다.
      - name: Compile classes for SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew compileJava

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --info

      - name: Quality Gate report
        if: env.SONAR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: bash .github/scripts/sonar-report.sh

  # ==========================================================================
  # Build Job - JAR 빌드 및 Artifact 업로드
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar

      - name: Integration Summary
        run: |
          echo "## Integration Summary (Dev)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
