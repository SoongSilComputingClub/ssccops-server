plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.sonarqube' version '7.3.1.8318'
}

group = 'org.sscc'

// 릴리스 버전. **git 태그(`v` + 이 값)와 같은 값을 유지한다** — 릴리스할 때 여기를 함께 올린다
// (AGENTS.md '릴리스' 절). v0.2.0까지 세 번의 릴리스 동안 이 값이 초기값 그대로였던 탓에
// 태그는 v0.2.0인데 산출물은 0.0.1-SNAPSHOT이었다.
//
// **-SNAPSHOT을 붙이지 않는다.** 이 저장소는 스냅숏을 배포하고 나중에 릴리스로 굳히는
// 사이클을 돌리지 않는다 — develop이 dev로, main이 prod로 그대로 나가고 릴리스는 태그다.
// 붙여 두면 어느 산출물도 릴리스가 아니게 되고, 지금 고치는 문제가 이름만 바뀌어 남는다.
version = '0.2.6'
description = 'SSCC 운영관리 백엔드'

// ============================================================================
// Coverage Exclusion Patterns (커버리지 **계산**에서만 빼는 패턴)
// ============================================================================
// 여기 있는 것은 전부 "테스트를 요구하지 않는다"는 뜻이지 "보지 않는다"가 아니다.
// **분석(sonar.exclusions)에는 절대 넘기지 말 것** — 그러면 스캐너가 그 파일을 아예 못 본다.
// 실제로 그렇게 돼 있었고, 보안 코드가 분석에서 통째로 빠졌다 (ssccops#232).
def coverageExcludePackages = [
    '**/config/**',      // Config 클래스 제외
    '**/exception/**',   // Exception 클래스 제외
    '**/dto/**',         // DTO 클래스 제외
    '**/apipayload/**',  // API 공통 응답 및 예외 처리 제외
    '**/security/**', // 시큐리티 관련 클래스 제외
    '**/apitest/**' // 테스트용 토큰 방법 api 제외
]

// JaCoCo용 제외 패턴 (클래스 파일)
def jacocoCoverageExcludes = coverageExcludePackages + ['**/*Application.class']

// Sonar 커버리지 제외 패턴 (소스 파일). 이름의 'Coverage'가 쓰임을 못 박는다 —
// sonar.coverage.exclusions 한 곳에만 쓴다.
def sonarCoverageExcludes = coverageExcludePackages.collect { it + '/*.java' } + ['**/Application.java']

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// META-INF/build-info.properties 를 산출물에 넣는다 → /actuator/info 가 group·artifact·name·
// version·time 을 돌려준다. 그 엔드포인트는 이미 노출 목록(include: health,info,...)에 있고
// SecurityConfig 가 permitAll 로 열어 두었는데, 이 파일이 없어 그동안 빈 {} 였다 —
// **배포된 것이 어느 버전인지 물을 자리가 없었다.**
//
// 값을 여기서 손으로 적지 않는다(management.info.env 로 버전을 따로 쓰는 방법도 있다).
// 그러면 같은 사실이 두 벌이 되어 다음 릴리스에 한쪽만 오른다.
springBoot {
    buildInfo()
}

// 산출물 이름에서 버전을 뺀다. Dockerfile 이 이 파일을 이름으로 집어 오므로, 고정해 두지
// 않으면 **버전을 올릴 때마다 Dockerfile 의 COPY 글롭이 함께 깨진다** — 실제로 -SNAPSHOT 을
// 떼는 이번 변경이 `COPY .../*-SNAPSHOT.jar` 를 무효로 만든다. 버전은 build-info 와 태그가
// 말하므로 파일명이 그것을 또 말할 이유가 없다.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// OpenTelemetry BOM for consistent versions
dependencyManagement {
    imports {
        mavenBom 'io.opentelemetry:opentelemetry-bom:1.44.1'
        mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.11.0-alpha'
        mavenBom 'software.amazon.awssdk:bom:2.29.29'
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Monitoring & Observability - OpenTelemetry (traces, logs)
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0'

    // Logstash encoder (JSON logging for prod profile)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // Micrometer - Prometheus (local scraping) + OTLP (push to Alloy)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-registry-otlp'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Flyway (ssccops#213). 스키마 변경을 버전 관리된 마이그레이션으로 내보내, ddl-auto: update가
    // 리네임을 '조용한 컬럼 추가'로 처리하는 경로를 없앤다 — prod에서 승인이 통째로 막혔던
    // ssccops#209가 그 경로였다.
    //
    // **아직 켜져 있지 않다.** spring.flyway.enabled가 모든 프로필에서 false다. baseline
    // (V1__baseline.sql)이 prod pg_dump 결과로 교체되기 전에 켜면 부팅이 깨진다.
    // Flyway 10부터 PostgreSQL 지원이 별도 모듈이라 두 개를 함께 넣는다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // CSV (회원 명부 이관 #84). 직접 split 하면 따옴표 안의 쉼표("회장,프로젝트장")와
    // 줄바꿈을 포함한 필드에서 반드시 깨진다 — 파서는 서버 한 곳(MemberImportParser)에만 둔다.
    implementation 'org.apache.commons:commons-csv:1.12.0'

    // Cloudflare R2 (S3 호환 오브젝트 스토리지, ssccops#113). R2 전용 SDK는 없고 S3 API와
    // 호환되므로 AWS SDK v2의 S3 모듈을 그대로 쓴다 — 엔드포인트만 R2로 덮어쓴다(R2Config).
    implementation 'software.amazon.awssdk:s3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // Testcontainers — FlywayMigrationValidateTest 하나만 쓴다 (ssccops#213).
    //
    // 일반 테스트는 H2에 남는다. 전면 전환은 #103이 컨텍스트를 58→25로 줄인 이득을 반납하고,
    // 이 테스트들이 공용 testdb 하나를 공유하며 'mbr이 비어 있다'(최초 가입자 부트스트랩 #71)
    // 같은 전제를 ddl-auto: create의 매 컨텍스트 재생성에 기대고 있어 공유 PostgreSQL로는
    // 성립하지 않는다. 마이그레이션 검증만 실제 PostgreSQL이 필요하다 —
    // baseline이 pg_dump 결과라 H2에서 아예 실행되지 않기 때문이다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // ArchUnit — 도메인 순환 검사 하나에만 쓴다 (ssccops#242).
    //
    // 별도 도구(플러그인·CI 단계)를 들이지 않은 것은, 순환은 컴파일되는 코드라 빌드가 잡아
    // 주지 않고 사람이 보기 전에는 드러나지 않기 때문이다 — 테스트로 두면 ./gradlew test 가
    // 이미 도는 자리에 얹힌다. 검사 대상은 domain 패키지의 슬라이스뿐이다.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// ============================================================================
// .env 로드 (docker-compose는 .env를 자동으로 읽지만, ./gradlew bootRun은 JVM 프로세스
// 환경변수를 직접 넘겨줘야 하므로 여기서 파싱해 bootRun 태스크에 주입한다)
// ============================================================================
def envFile = rootProject.file('.env')
def envVars = [:]
if (envFile.exists()) {
    envFile.readLines().each { line ->
        def trimmed = line.trim()
        if (trimmed && !trimmed.startsWith('#')) {
            def idx = trimmed.indexOf('=')
            if (idx > 0) {
                def key = trimmed.substring(0, idx).trim()
                def value = trimmed.substring(idx + 1).trim().replaceAll(/^["']|["']$/, '')
                envVars[key] = value
            }
        }
    }
    tasks.named('bootRun') {
        environment(envVars)
    }
}

// ============================================================================
// R2 업로드 경로 진단 (#137). 브라우저가 지나는 길(자격증명 → CORS → 서명 PUT → 프리플라이트)을
// 서버에서 그대로 한 번 밟아 본다 — 업로드 실패는 PUT이 서버를 거치지 않아 로그에 남지 않는다.
//
//   ./gradlew r2Check
//   ./gradlew r2Check -Pargs="--apply-cors"
//   ./gradlew r2Check -Pargs="--apply-cors --origin=http://localhost:3000"
//
// 값은 환경변수에서 읽으며 .env가 있으면 그것을 주입한다(없으면 셸 환경을 그대로 물려받는다).
// 배포 아티팩트에 들어가지 않도록 도구 자체는 테스트 소스에 둔다.
// ============================================================================
tasks.register('r2Check', JavaExec) {
    group = 'verification'
    description = 'R2 업로드 경로 진단 (자격증명·버킷 CORS·서명 PUT·프리플라이트)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.sscc.ssccopsserver.tools.R2Check'
    if (!envVars.isEmpty()) {
        environment(envVars)
    }
    if (project.hasProperty('args')) {
        args project.property('args').toString().split(' ').findAll { it }
    }
}

// ============================================================================
// Test
// ============================================================================
tasks.named('test') {
    useJUnitPlatform()

    // 테스트 JVM 힙. Gradle 기본값(512MB)으로는 부족해 GC가 계속 돌기만 하고 테스트가
    // 사실상 진행되지 않는다 — #103에서 실측했다. 스텁 통합으로 컨텍스트가 58개에서 25개로
    // 줄어든 뒤에도 512MB에서는 21분 동안 테스트 클래스 하나도 끝나지 않았다(워커 CPU 시간
    // 6,327초 — 벽시계의 다섯 배이며, 전부 GC다). 같은 트리가 1g에서는 checkstyle·spotless·
    // jacoco까지 포함해 3분 27초에 끝난다.
    //
    // 2g가 아니라 1g인 것은 컨텍스트 수가 절반 아래로 내려갔기 때문이다. 2g는 클래스마다
    // @TestConfiguration을 두어 컨텍스트가 클래스 수만큼 생기던 시절의 값이다.
    //
    // 컨텍스트를 더 늘리는 테스트(고정 Clock·독립 DB·@MockitoBean)를 더할 때 이 값이 다시
    // 빠듯해질 수 있다. 그때 올리기 전에 그 격리가 정말 필요한지부터 볼 것 — 힙을 올리는 것은
    // 컨텍스트가 늘어난 사실을 가리는 쪽이고, #103이 걷어낸 것이 그 종류의 처치다.
    maxHeapSize = '1g'

    // 테스트 JVM의 기본 시간대를 서비스 표준 시간대에 맞춘다.
    //
    // 운영 코드는 시각을 주입된 Clock에서 가져오고 그 Clock은 Asia/Seoul로 고정돼 있다
    // (ClockConfig · AP-12). 반면 테스트는 "오늘"을 LocalDate.now()로 만드는데, 이쪽은 JVM
    // 기본 시간대를 따르므로 **러너의 시간대가 KST가 아니면 두 '오늘'이 하루 어긋난다.**
    //
    // 로컬(KST)에서는 두 값이 같아 드러나지 않고, UTC로 도는 GitHub Actions에서 한국 시간
    // 00:00~09:00(UTC 15:00~24:00)에 CI가 돌 때만 터진다 — 역할 유효기간 경계를 보는
    // 테스트들(roleEndingTodayIsStillValid · futureAssignmentIsNotCurrentYet 등)이 그때
    // 한꺼번에 실패한다. 실패가 시각에 달려 있어 재실행하면 통과하므로 원인을 찾기 어렵다.
    //
    // 테스트마다 LocalDate.now(SERVICE_ZONE)으로 고치지 않고 여기서 한 번에 맞추는 것은,
    // 그 방식이면 새로 쓰는 테스트가 LocalDate.now()를 부르는 순간 같은 함정이 되살아나기
    // 때문이다. 서비스의 '오늘'이 Asia/Seoul이라는 사실을 테스트 환경 전체에 건다.
    systemProperty 'user.timezone', 'Asia/Seoul'

    finalizedBy jacocoTestReport, jacocoTestCoverageVerification
}

// ============================================================================
// JaCoCo (Code Coverage)
// ============================================================================
jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoCoverageExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoCoverageExcludes)
        }))
    }

    violationRules {
        rule {
            limit {
                minimum = 0.0
            }
        }
    }

    // 검사할 클래스가 없으면 커버리지 검증 건너뛰기
    doFirst {
        def hasClasses = classDirectories.files.any { dir ->
            dir.exists() && fileTree(dir: dir, exclude: jacocoCoverageExcludes).files.size() > 0
        }
        if (!hasClasses) {
            println "No classes to verify coverage. Skipping jacocoTestCoverageVerification."
            throw new StopExecutionException()
        }
    }
}

// ============================================================================
// Checkstyle (Code Style) - Naver Conventions
// ============================================================================
checkstyle {
    toolVersion = '10.21.4'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    configDirectory = file("${rootDir}/config/checkstyle")
    ignoreFailures = false
    maxWarnings = 0
}

// ============================================================================
// Spotless (Code Formatting) - 4-space indentation, Naver import order
// ============================================================================
spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
        // Naver convention import order: java -> javax -> jakarta -> org -> net -> com -> others -> lombok
        importOrder('java', 'javax', 'jakarta', 'org', 'net', 'com', '', 'lombok')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ============================================================================
// SonarQube (Self-Hosted)
// ============================================================================
sonar {
    properties {
        property 'sonar.projectKey', 'ssccops-server'
        property 'sonar.projectName', 'ssccops-server'
        // Java 분석을 위한 바이너리 경로
        property 'sonar.java.binaries', 'build/classes/java/main'
        property 'sonar.java.libraries', "${System.getProperty('user.home')}/.gradle/caches/**/modules-*/files-*/**/*.jar"
        // JaCoCo 커버리지
        property 'sonar.java.coveragePlugin', 'jacoco'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions', sonarCoverageExcludes.join(',')

        // sonar.exclusions 는 **의도적으로 두지 않는다** (ssccops#232).
        //
        // 예전에는 여기에 sonarCoverageExcludes 를 그대로 넘겼다. 두 속성은 이름이 비슷하지만
        // 뜻이 다르다 — coverage.exclusions 는 "커버리지 계산에서 뺀다"이고 exclusions 는
        // "**분석 자체에서 뺀다**"라 그 파일이 스캐너에 존재하지 않는 것이 된다. 그래서
        // src/main/java 562개 중 약 240개(43%)가 안 보였고, 그중에 global/security/** 가
        // 있었다 — SecurityConfig(permitAll 경로를 정하는 곳)·JWT 컨버터·인가 애스펙트가
        // 전부 거기다. **보안 분석을 켜 두고 보안 코드를 보지 않는 상태였다.**
        //
        // 지금 분석에서 뺄 것이 하나도 없다. 생성 코드는 build/ 아래라 소스 세트에 없고
        // (sourceSets 커스터마이즈도, 생성 소스 디렉터리도 없다), Application.java 의 main 은
        // 커버리지에서 빼는 값이지 분석에서 감출 값이 아니다.
        //
        // **커버리지 제외를 늘릴 일이 있어도 이 속성을 되살리지 말 것.** 한 줄이라도 남기면
        // "이 속성은 쓰는 것"이 되어 다음에 목록이 다시 자란다.
    }
}