spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  security:
    oauth2:
      resourceserver:
        jwt:
          # 테스트는 SecurityMockMvcRequestPostProcessors.jwt()로 디코더를 우회하므로 실제 네트워크 호출 없음
          jwk-set-uri: http://localhost/auth/v1/.well-known/jwks.json
  jpa:
    hibernate:
      # create-drop이 아니라 create다. ADR-0009로 JWT 설정을 합친 뒤에도 고정 Clock·독립 DB·
      # MockitoBean 때문에 여러 테스트 컨텍스트가 위의 testdb 하나를 공유한다. create-drop은
      # 그중 한 EntityManagerFactory가 닫힐 때 공유 스키마를 통째로 지워, 아직 살아 있는 다른
      # 컨텍스트가 "Table MBR not found (this database is empty)"로 떨어질 수 있다.
      # create는 컨텍스트가 뜰 때만 drop+create 하고 닫을 때는 아무것도 하지 않으므로
      # 파괴 시점이 하나 줄어든다(뜰 때 지우는 것은 create-drop도 똑같이 한다).
      # 인메모리라 남은 스키마는 JVM이 끝나면 함께 사라진다.
      ddl-auto: create
      # ssccops#213은 '테스트도 Flyway로 스키마를 만든다'로 정했지만 **여기는 아직 create다.**
      # 테스트는 H2 인메모리에서 도는데(아래 H2Dialect) baseline은 prod pg_dump 결과라
      # SET·OWNER TO·jsonb·시퀀스 문법이 H2에서 실행되지 않는다. 옮기려면 테스트를 PostgreSQL
      # (Testcontainers) 위로 올리거나 H2용 마이그레이션을 따로 두어야 하는데, 앞은 로컬에도
      # Docker를 요구하고 뒤는 스키마 정의가 두 벌이 된다 — 정해지지 않았다
      # (ssccops-server#262의 '열린 결정').
    database-platform: org.hibernate.dialect.H2Dialect

# 관측성 내보내기는 테스트에서 전부 끈다.
#
# 테스트 환경에는 OTLP 수집기가 없으므로 스팬·로그가 나가지 못하고 BatchSpanProcessor·
# BatchLogRecordProcessor의 큐에 그대로 쌓인다. OTel SDK는 스프링 컨텍스트마다 한 벌이라
# 컨텍스트를 합쳐도 큐와 내보내기 실패 로그를 만들 이유가 없다.
#
# 끄는 것이 무해한 이유는 이 저장소의 어떤 테스트도 트레이스·메트릭을 확인하지 않기 때문이다.
# 운영 프로필의 설정은 그대로이며 여기서만 덮어쓴다.
otel:
  sdk:
    disabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false

# Cloudflare R2 (S3 호환 오브젝트 스토리지, ssccops#113). R2Config가 컨텍스트 기동 시
# S3Client를 즉시 만들므로(빈 생성 자체는 네트워크를 타지 않는다) 값이 없으면 R2와 무관한
# 모든 테스트가 컨텍스트 로딩 단계에서 실패한다. R2ConnectionManualTest(태그 r2-manual)만
# 이 값을 실제로 쓰며 기본 test 태스크에서 제외돼 있어 더미 값으로도 문제없다.
r2:
  account-id: test-account
  access-key-id: test-access-key
  secret-access-key: test-secret-key
  bucket-name: test-bucket

# 이 API 자신의 공개 주소 (#208). 행사 이미지 리다이렉트 주소의 접두사이며
# EventImageControllerTest·PublicEventImageControllerTest가 이 값으로 발급 주소를 확인한다.
app:
  public-base-url: https://api.test.local

# Frontend Configuration (CORS 허용 오리진)
frontend:
  url: http://localhost:5173

# 기획안 시스템 폼 시드가 회원 생성에 반응하는 경로를 끈다 (#184).
#
# 시드가 세운 폼은 생성자 회원을 FK로 묶는다(form.creatr_mbr_id). 그런데 공용 H2(testdb)를
# 쓰면서 회원을 실제로 커밋했다가 지우는 테스트가 여럿 있어(명부 이관·역할 자기잠금·계정 연결),
# 그 회원이 시드의 명의로 뽑히면 정리 단계의 DELETE FROM mbr이 참조 무결성 위반으로 깨진다.
# 회원 도메인 테스트가 정리하려고 기획안 폼의 존재를 알아야 하는 것은 방향이 거꾸로다 —
# 위 관측성 내보내기를 끈 것과 같은 종류의 결정이다.
#
# 끄는 것이 무해한 이유는 이 경로를 확인하는 테스트가 ProposalFormSeedOnMemberCreatedTest
# 하나이고, 그 클래스가 자기 전용 DB와 함께 이 값을 스스로 켜기 때문이다. 기동 시드(ApplicationRunner)는
# 이 값과 무관하게 그대로 돈다.
ssccops:
  form:
    proposal-seed:
      on-member-created: false
