spring:
  datasource:
    # JDBC URL을 통째로 받지 않고 조각으로 조립한다. 접속 주소가 실행 방식에 따라 갈리기
    # 때문이다 — `./gradlew bootRun`은 호스트에서 도니 localhost:15432(compose가 게시한
    # 포트)를, docker compose의 backend 컨테이너는 같은 네트워크의 postgres:5432를 본다.
    # URL 한 덩어리로 받으면 두 값이 충돌해 실행 방식을 바꿀 때마다 .env를 고쳐야 한다.
    # 조각으로 두면 compose가 DB_HOST/DB_PORT만 덮어써서 .env 한 벌로 양쪽이 동작한다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:ssccops_server_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Cloudflare R2 (S3 호환 오브젝트 스토리지, ssccops#113)
r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME:ssccops-local}

# 이 API 자신의 공개 주소 (#208). 행사 이미지의 영구 읽기 주소
# ({app.public-base-url}/public/v1/events/{eventId}/images/{fileName})를 이 값으로 조립하며,
# 그 문자열이 행사 본문 마크다운에 굳는다 — 틀린 값을 넣으면 우리 도메인의 이미지 링크가
# 통째로 깨진다. 비어 있으면 부팅이 아니라 이미지 발급 요청이 거절된다(AppPublicBaseUrl).
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Frontend Configuration (CORS 허용 오리진 · 쉼표로 여러 개)
# 예전에는 여기에 http://localhost:3000 이 하드코딩돼 있어, docker-compose가 넘기던
# frontend-url 이 아무 데도 쓰이지 않았다. 웹을 다른 포트로 띄우면 CORS가 막히는데
# .env 를 고쳐도 반영되지 않아 원인을 찾기 어려웠다.
frontend:
  # 3000 = admin · 3001 = www · 3002 = lms(학술). 로컬에서 여러 앱을 함께 띄우므로 셋 다 허용한다
  url: ${FRONTEND_URL:http://localhost:3000,http://localhost:3001,http://localhost:3002}


logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

#OpenTelemetry : off
otel:
  sdk:
    disabled: true
management:
  otlp:
    metrics:
      export:
        enabled: false
    logging:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
