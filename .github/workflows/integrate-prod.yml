# ============================================================================
# Backend Integration Workflow - Production
# ============================================================================
# 역할:
#   - 소스 코드 정적 분석 (Spotless, Checkstyle)
#   - 테스트 수행 및 JaCoCo 커버리지 생성
#   - JAR 빌드 검증 (bootJar 가 깨지지 않는지만 본다 — 배포는 Coolify 몫이다)
#
# Job 구조:
#   lint ──┬──> build
#   test ──┘
#
# 대상 브랜치: main (production 환경)
#
# **SonarQube 분석은 여기서 돌지 않는다** (ssccops#238).
#   이 서버는 Community Build 26.8.0 이고 브랜치 플러그인이 없어(ssccops#234) 브랜치를 가르지
#   못한다 — 모든 분석이 프로젝트 기본 브랜치 한 자리를 덮어쓴다. develop 과 main 이 둘 다
#   돌면 그 자리가 두 브랜치 사이를 오가 어느 쪽 수치인지 알 수 없어지므로 하나만 남겼고,
#   **develop 이 항상 앞서므로 그쪽을 택했다**(integrate-dev.yml 의 analyze job).
#   릴리스 시점의 수치가 필요하면 그 직전 develop 분석이 곧 그 값이다.
# ============================================================================

name: Integrate Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  JAVA_VERSION: '17'

jobs:
  # ==========================================================================
  # Lint Job - 코드 스타일 검사
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  # ==========================================================================
  # Test Job - 테스트 및 커버리지
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Run Tests with JaCoCo
        run: ./gradlew test jacocoTestReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: ignore

  # ==========================================================================
  # Build Job - JAR 빌드 및 Artifact 업로드
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execution to Gradle wrapper
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar

      - name: Integration Summary
        run: |
          echo "## Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY