spring:
  datasource:
    url: ${PROD_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${PROD_DATABASE_USER}
    password: ${PROD_DATABASE_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PROD_SUPABASE_URL}/auth/v1/.well-known/jwks.json

  jpa:
    hibernate:
      # 정식 버전 전까지 한시적으로 update다. none일 때는 엔티티가 늘 때마다 배포 전에
      # CREATE TABLE·CREATE INDEX를 사람이 먼저 실행해야 했고, 빠뜨리면 배포가 아니라
      # 첫 요청에서 터졌다 — 스키마가 아직 매 이슈마다 바뀌는 단계라 그 수동 단계가
      # 실질적인 배포 실패 원인이었다.
      # update는 새 테이블·컬럼·인덱스만 추가하며 **컬럼 삭제·이름 변경·타입 변경은
      # 반영하지 않는다** — 그런 변경은 prod DB에 수동 ALTER가 여전히 필요하다.
      # 데이터가 있는 DB라 dev(#83)처럼 "드리프트가 쌓이면 통째로 재생성"이라는
      # 탈출구가 없다. 정식 버전 시점에 Flyway/Liquibase를 넣고 none으로 되돌린다.
      ddl-auto: update

  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false # /v3/api-docs API
  swagger-ui:
    enabled: false # /swagger-ui.html

# Cloudflare R2 (S3 호환 오브젝트 스토리지, ssccops#113)
r2:
  account-id: ${PROD_R2_ACCOUNT_ID}
  access-key-id: ${PROD_R2_ACCESS_KEY_ID}
  secret-access-key: ${PROD_R2_SECRET_ACCESS_KEY}
  bucket-name: ${PROD_R2_BUCKET_NAME}

# 이 API 자신의 공개 주소 (#208). 행사 이미지의 영구 읽기 주소
# ({app.public-base-url}/public/v1/events/{eventId}/images/{fileName})를 이 값으로 조립하며,
# 그 문자열이 행사 본문 마크다운에 굳는다 — 틀린 값을 넣으면 우리 도메인의 이미지 링크가
# 통째로 깨진다. **없거나 스킴이 빠지면 부팅이 실패한다**(#216 · AppPublicBaseUrl) — 설정 누락이
# 몇 시간 뒤 발급 500으로 발견되던 것을 배포 로그 첫 줄로 옮긴 것이다.
app:
  public-base-url: ${PROD_APP_PUBLIC_BASE_URL}

# Frontend Configuration (CORS 허용 오리진)
frontend:
  url: ${PROD_FRONTEND_URL}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

#OpenTelemetry : off
otel:
  sdk:
    disabled: true
management:
  otlp:
    metrics:
      export:
        enabled: false
    logging:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
