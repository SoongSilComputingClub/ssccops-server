plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.sonarqube' version '7.2.0.6526'
}

group = 'org.sscc'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

// ============================================================================
// Coverage Exclusion Patterns (공통 제외 패턴)
// ============================================================================
def coverageExcludePackages = [
    '**/config/**',      // Config 클래스 제외
    '**/exception/**',   // Exception 클래스 제외
    '**/dto/**',         // DTO 클래스 제외
    '**/apipayload/**',  // API 공통 응답 및 예외 처리 제외
    '**/security/**', // 시큐리티 관련 클래스 제외
    '**/apitest/**' // 테스트용 토큰 방법 api 제외
]

// JaCoCo용 제외 패턴 (클래스 파일)
def jacocoCoverageExcludes = coverageExcludePackages + ['**/*Application.class']

// Sonar용 제외 패턴 (소스 파일)
def sonarCoverageExcludes = coverageExcludePackages.collect { it + '/*.java' } + ['**/Application.java']

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// OpenTelemetry BOM for consistent versions
dependencyManagement {
    imports {
        mavenBom 'io.opentelemetry:opentelemetry-bom:1.44.1'
        mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.11.0-alpha'
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Monitoring & Observability - OpenTelemetry (traces, logs)
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0'

    // Logstash encoder (JSON logging for prod profile)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // Micrometer - Prometheus (local scraping) + OTLP (push to Alloy)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-registry-otlp'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // CSV (회원 명부 이관 #84). 직접 split 하면 따옴표 안의 쉼표("회장,프로젝트장")와
    // 줄바꿈을 포함한 필드에서 반드시 깨진다 — 파서는 서버 한 곳(MemberImportParser)에만 둔다.
    implementation 'org.apache.commons:commons-csv:1.12.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

// ============================================================================
// .env 로드 (docker-compose는 .env를 자동으로 읽지만, ./gradlew bootRun은 JVM 프로세스
// 환경변수를 직접 넘겨줘야 하므로 여기서 파싱해 bootRun 태스크에 주입한다)
// ============================================================================
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    def envVars = [:]
    envFile.readLines().each { line ->
        def trimmed = line.trim()
        if (trimmed && !trimmed.startsWith('#')) {
            def idx = trimmed.indexOf('=')
            if (idx > 0) {
                def key = trimmed.substring(0, idx).trim()
                def value = trimmed.substring(idx + 1).trim().replaceAll(/^["']|["']$/, '')
                envVars[key] = value
            }
        }
    }
    tasks.named('bootRun') {
        environment(envVars)
    }
}

// ============================================================================
// Test
// ============================================================================
tasks.named('test') {
    useJUnitPlatform()

    // 테스트 JVM 힙. Gradle 기본값(512MB)으로는 부족해 컨텍스트 로딩이 OutOfMemoryError로
    // 실패하며, 어느 테스트가 깨지는지는 실행 순서에 따라 매번 달라진다.
    //
    // 이 레포는 테스트 클래스마다 자기 몫의 @TestConfiguration(StubJwtDecoderConfig)을 두므로
    // ApplicationContext가 클래스 수만큼 생긴다. #81이 공용 H2 스키마가 지워지는 것을 막으려
    // spring.test.context.cache.maxSize를 32에서 64로 올리면서 동시에 살아 있는 컨텍스트도
    // 두 배가 됐다. 캐시를 되돌리면 이번엔 컨텍스트 교체가 잦아져 스키마 문제가 돌아온다.
    //
    // 근본 해법은 스텁 설정을 한 곳으로 모아 컨텍스트 수 자체를 줄이는 것이고(별도 이슈),
    // 그때까지는 힙을 늘려 둔다.
    maxHeapSize = '2g'

    // 테스트 JVM의 기본 시간대를 서비스 표준 시간대에 맞춘다.
    //
    // 운영 코드는 시각을 주입된 Clock에서 가져오고 그 Clock은 Asia/Seoul로 고정돼 있다
    // (ClockConfig · AP-12). 반면 테스트는 "오늘"을 LocalDate.now()로 만드는데, 이쪽은 JVM
    // 기본 시간대를 따르므로 **러너의 시간대가 KST가 아니면 두 '오늘'이 하루 어긋난다.**
    //
    // 로컬(KST)에서는 두 값이 같아 드러나지 않고, UTC로 도는 GitHub Actions에서 한국 시간
    // 00:00~09:00(UTC 15:00~24:00)에 CI가 돌 때만 터진다 — 역할 유효기간 경계를 보는
    // 테스트들(roleEndingTodayIsStillValid · futureAssignmentIsNotCurrentYet 등)이 그때
    // 한꺼번에 실패한다. 실패가 시각에 달려 있어 재실행하면 통과하므로 원인을 찾기 어렵다.
    //
    // 테스트마다 LocalDate.now(SERVICE_ZONE)으로 고치지 않고 여기서 한 번에 맞추는 것은,
    // 그 방식이면 새로 쓰는 테스트가 LocalDate.now()를 부르는 순간 같은 함정이 되살아나기
    // 때문이다. 서비스의 '오늘'이 Asia/Seoul이라는 사실을 테스트 환경 전체에 건다.
    systemProperty 'user.timezone', 'Asia/Seoul'

    finalizedBy jacocoTestReport, jacocoTestCoverageVerification
}

// ============================================================================
// JaCoCo (Code Coverage)
// ============================================================================
jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoCoverageExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoCoverageExcludes)
        }))
    }

    violationRules {
        rule {
            limit {
                minimum = 0.0
            }
        }
    }

    // 검사할 클래스가 없으면 커버리지 검증 건너뛰기
    doFirst {
        def hasClasses = classDirectories.files.any { dir ->
            dir.exists() && fileTree(dir: dir, exclude: jacocoCoverageExcludes).files.size() > 0
        }
        if (!hasClasses) {
            println "No classes to verify coverage. Skipping jacocoTestCoverageVerification."
            throw new StopExecutionException()
        }
    }
}

// ============================================================================
// Checkstyle (Code Style) - Naver Conventions
// ============================================================================
checkstyle {
    toolVersion = '10.21.4'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    configDirectory = file("${rootDir}/config/checkstyle")
    ignoreFailures = false
    maxWarnings = 0
}

// ============================================================================
// Spotless (Code Formatting) - 4-space indentation, Naver import order
// ============================================================================
spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
        // Naver convention import order: java -> javax -> jakarta -> org -> net -> com -> others -> lombok
        importOrder('java', 'javax', 'jakarta', 'org', 'net', 'com', '', 'lombok')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ============================================================================
// SonarQube (Self-Hosted)
// ============================================================================
sonar {
    properties {
        property 'sonar.projectKey', 'ssccops-server'
        property 'sonar.projectName', 'ssccops-server'
        // Java 분석을 위한 바이너리 경로
        property 'sonar.java.binaries', 'build/classes/java/main'
        property 'sonar.java.libraries', "${System.getProperty('user.home')}/.gradle/caches/**/modules-*/files-*/**/*.jar"
        // JaCoCo 커버리지
        property 'sonar.java.coveragePlugin', 'jacoco'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions', sonarCoverageExcludes.join(',')
        property 'sonar.exclusions', sonarCoverageExcludes.join(',')
    }
}