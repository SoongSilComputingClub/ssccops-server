# ============================================================================
# Backend Deploy Workflow - Dev (Coolify + GHCR)
# ============================================================================
# 역할:
#   - Integrate Dev workflow 성공 후 자동 실행
#   - integrate-dev에서 생성된 JAR artifact 사용 (빌드 재수행 없음)
#   - Docker 이미지 빌드 및 GHCR 푸시 (태그: :dev)
#   - Coolify webhook으로 dev 서버 배포 트리거
#
# Job 구조:
#   prepare ──> build-image ──> deploy
#
# 트리거:
#   - Integrate Dev workflow가 develop 브랜치에서 성공적으로 완료된 후
#   - 수동 실행 (workflow_dispatch) - 최근 성공한 integrate-dev run의 artifact 사용
#
# GitHub Environment: dev
#   (Settings > Environments > dev 에 아래 시크릿 등록)
#   - DEV_COOLIFY_WEBHOOK     : Dev Coolify 배포 webhook URL
#   - DEV_COOLIFY_TOKEN       : Dev Coolify API Token
#   - DEV_COOLIFY_URL         : Dev Coolify 서버 URL
#   - DEV_COOLIFY_SERVICE_ID  : Dev Coolify 애플리케이션 서비스 UUID
#   - DEV_DATABASE_URL        : Dev DB URL (jdbc:postgresql://...)
#   - DEV_DATABASE_USER       : Dev DB 사용자명
#   - DEV_DATABASE_PASSWORD   : Dev DB 비밀번호
#   - DEV_SUPABASE_URL        : Dev Supabase 프로젝트 URL (JWKS 조회에 쓰인다)
#   - DEV_FRONTEND_URL        : CORS 허용 오리진 (쉼표로 여러 개 가능)
#
#   주입하는 키 이름은 application-dev.yaml 의 플레이스홀더와 정확히 같아야 한다
#   (${DEV_DATABASE_URL} 등). 이름이 어긋나면 배포는 성공하고 부팅에서 죽는다.
#
#   deploy-prod.yml 과 달리 JWT·Google OAuth 시크릿이 없다 — 자체 JWT 발급과
#   구글 OAuth2 로그인 스택이 제거되고 Supabase Auth 리소스 서버로 전환되면서
#   애플리케이션이 더는 그 값을 읽지 않는다.
#
#   SPRING_PROFILES_ACTIVE 는 시크릿이 아니라 리터럴 'dev' 다. 이 워크플로가
#   배포하는 대상은 언제나 dev 환경이라, 시크릿으로 두면 값 하나를 잘못 넣어
#   dev 이미지가 prod 프로필로 뜨는 경로만 생긴다.
# ============================================================================

name: Deploy Backend to Dev

on:
  workflow_run:
    workflows: ["Integrate Dev"]
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ssccops-server

jobs:
  # ==========================================================================
  # Prepare Job - Artifact 준비
  # ==========================================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    # workflow_run 트리거일 경우 integrate 성공 및 push 이벤트일 때만 실행
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    outputs:
      run_id: ${{ steps.get-run-info.outputs.run_id }}
      head_sha: ${{ steps.get-run-info.outputs.head_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get workflow run info
        id: get-run-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Finding latest successful integrate run..."

            # 최근 성공한 Integrate Dev workflow run 조회
            RUN_INFO=$(gh run list \
              --workflow "Integrate Dev" \
              --branch develop \
              --status success \
              --event push \
              --limit 1 \
              --json databaseId,headSha)

            RUN_ID=$(echo "$RUN_INFO" | jq -r '.[0].databaseId')
            HEAD_SHA=$(echo "$RUN_INFO" | jq -r '.[0].headSha')

            if [ "$RUN_ID" == "null" ] || [ -z "$RUN_ID" ]; then
              echo "::error::No successful integrate workflow run found"
              exit 1
            fi

            echo "Found run ID: $RUN_ID, commit: $HEAD_SHA"
          else
            echo "workflow_run trigger detected"
            RUN_ID="${{ github.event.workflow_run.id }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

      - name: Download artifact from Integrate workflow
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app
          path: build/libs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.get-run-info.outputs.run_id }}

      - name: Verify and upload artifact
        run: |
          echo "Downloaded artifacts:"
          ls -la build/libs/
          JAR_FILE=$(ls build/libs/*.jar | head -1)
          echo "JAR file: $JAR_FILE"

      - name: Upload artifact for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: build/libs/*.jar
          retention-days: 1

  # ==========================================================================
  # Build Image Job - Docker 빌드 및 GHCR 푸시
  # ==========================================================================
  build-image:
    runs-on: ubuntu-latest
    needs: [prepare]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact
          path: build/libs

      # Docker IMAGE_NAME을 소문자로 변환
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.deploy
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.head_sha }}
            ${{ env.IMAGE_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy Job - Coolify 환경변수 주입 후 webhook으로 배포 트리거
  # 사전 조건: Coolify 대시보드에서 이미지 소스가
  #            ghcr.io/<owner>/ssccops-server:dev (소문자) 로 설정되어 있어야 함
  # ==========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [prepare, build-image]
    environment: dev

    steps:
      - name: Update Coolify environment variables
        env:
          COOLIFY_URL: ${{ secrets.DEV_COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.DEV_COOLIFY_TOKEN }}
          COOLIFY_SERVICE_ID: ${{ secrets.DEV_COOLIFY_SERVICE_ID }}
        run: |
          # Build JSON array of all environment variables
          ENV_DATA=$(jq -n \
            --arg db_url "${{ secrets.DEV_DATABASE_URL }}" \
            --arg db_user "${{ secrets.DEV_DATABASE_USER }}" \
            --arg db_pass "${{ secrets.DEV_DATABASE_PASSWORD }}" \
            --arg supabase_url "${{ secrets.DEV_SUPABASE_URL }}" \
            --arg frontend_url "${{ secrets.DEV_FRONTEND_URL }}" \
            '{
              data: [
                {key: "SPRING_PROFILES_ACTIVE", value: "dev", is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false},
                {key: "DEV_DATABASE_URL", value: $db_url, is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false},
                {key: "DEV_DATABASE_USER", value: $db_user, is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false},
                {key: "DEV_DATABASE_PASSWORD", value: $db_pass, is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false},
                {key: "DEV_SUPABASE_URL", value: $supabase_url, is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false},
                {key: "DEV_FRONTEND_URL", value: $frontend_url, is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false}
              ]
            }'
          )

          # Send bulk update request
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PATCH "$COOLIFY_URL/api/v1/applications/$COOLIFY_SERVICE_ID/envs/bulk" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$ENV_DATA")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Response body: $RESPONSE_BODY"

          if [ "$HTTP_STATUS" -ne 201 ]; then
            echo "::error::Failed to update environment variables (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Successfully updated all environment variables (HTTP $HTTP_STATUS)"

      - name: Deploy to Coolify via webhook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --request GET '${{ secrets.DEV_COOLIFY_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.DEV_COOLIFY_TOKEN }}')

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Coolify deployment failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Coolify deployment triggered successfully (HTTP $HTTP_STATUS)"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary (Dev)" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_NAME }}:dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ needs.prepare.outputs.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Run ID**: ${{ needs.prepare.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: GHCR (ghcr.io)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Target**: Coolify (Dev)" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
