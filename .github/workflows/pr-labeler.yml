name: PR Labeler

# PR에 크기 라벨과 타입 라벨을 붙인다.
#
# 타입은 **연결된 이슈의 라벨에서 가져온다.** 이슈를 열 때 제목 접두어로 이미 정해진 값이라
# 여기서 다시 판정하지 않는다 — 같은 판정을 두 곳에서 하면 갈린다.
# 이슈가 연결되지 않았으면 타입 라벨은 건드리지 않는다.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write # 라벨 '생성'은 issues 스코프다. pull-requests만으로는 403이 난다

    steps:
      - name: Label PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // 크기 구간은 배열로 둔다 — 객체 키 순서에 기대면 재배치할 때 판정이 조용히 바뀐다
            const SIZES = [
              { name: 'size/XS', max: 10,       color: '3CBF00' },
              { name: 'size/S',  max: 50,       color: '5D9801' },
              { name: 'size/M',  max: 200,      color: 'FBCA04' },
              { name: 'size/L',  max: 500,      color: 'FFA500' },
              { name: 'size/XL', max: Infinity, color: 'D93F0B' }
            ];
            const TYPES = {
              feat:     { color: '0E8A16', description: '새로운 기능' },
              fix:      { color: 'D93F0B', description: '버그 수정' },
              refactor: { color: '1D76DB', description: '리팩토링' },
              chore:    { color: 'D4C5F9', description: '기타 변경사항' },
              design:   { color: 'F9D0C4', description: 'UI/디자인 변경' },
              style:    { color: 'FEF2C0', description: '코드 스타일 변경' },
              docs:     { color: '0075CA', description: '문서 수정' },
              test:     { color: 'BFD4F2', description: '테스트 코드' },
              cicd:     { color: 'FBCA04', description: 'CI/CD 관련' }
            };

            const ensure = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };
            const drop = async (name) => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (e) {
                if (e.status !== 404) throw e; // 그 사이 누가 뗐을 수 있다
              }
            };

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const { data: current } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const names = current.map(l => l.name);

            // ── 크기 ────────────────────────────────────────────────────────
            const changes = pr.additions + pr.deletions;
            const size = SIZES.find(s => changes <= s.max);

            if (!names.includes(size.name)) {
              // 붙인 뒤에 뗀다. 지우고 만들다 실패하면 크기 라벨이 없는 PR이 남는다
              await ensure(size.name, size.color, `PR size: ${size.name.replace('size/', '')}`);
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [size.name] });
              for (const stale of names.filter(n => n.startsWith('size/'))) await drop(stale);
            }
            console.log(`📊 +${pr.additions} -${pr.deletions} → ${size.name}`);

            // ── 타입 ────────────────────────────────────────────────────────
            const linked = await github.graphql(`
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 10) {
                      nodes { number labels(first: 30) { nodes { name } } }
                    }
                  }
                }
              }`, { owner, repo, pr: issue_number });

            let type = null;
            let from = null;
            for (const issue of linked.repository.pullRequest.closingIssuesReferences.nodes) {
              const hit = issue.labels.nodes.map(l => l.name).find(n => n in TYPES);
              if (hit) { type = hit; from = issue.number; break; }
            }

            if (!type) {
              console.log('ℹ️ 연결된 이슈가 없거나 그 이슈에 타입 라벨이 없어 타입은 그대로 둡니다.');
              console.log('   PR 본문에 `- closed: #번호`를 넣으면 그 이슈의 타입을 따라갑니다.');
              return;
            }

            if (!names.includes(type)) {
              await ensure(type, TYPES[type].color, TYPES[type].description);
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [type] });
            }
            // PR당 타입 라벨은 하나다. size/* 와 목록 밖 라벨은 건드리지 않는다
            for (const stale of names.filter(n => n in TYPES && n !== type)) await drop(stale);

            console.log(`🏷 타입: ${type} (이슈 #${from})`);
