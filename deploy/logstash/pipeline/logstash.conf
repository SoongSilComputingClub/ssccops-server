# ssccops 로그 파이프라인 — 정본은 ssccops-server/deploy/logstash/pipeline/logstash.conf
# 파싱하지 않는다. 애플리케이션이 ECS 구조 JSON을 보내고, 여기서는 라우팅만 한다.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 헬스체크·액추에이터 잡음은 버린다
  if [url][path] and [url][path] =~ /^\/actuator/ {
    drop { }
  }
  # dataset·environment가 비어 오면 기본값 — 없는 stream으로 흩어지지 않게
  if ![event][dataset] {
    mutate { add_field => { "[event][dataset]" => "ssccops.application" } }
  }
  if ![service][environment] {
    mutate { add_field => { "[service][environment]" => "unknown" } }
  }
  # data_stream.* 필드가 있으면 elasticsearch output이 그대로 라우팅한다
  # → logs-{dataset}-{namespace} : logs-ssccops.audit-prod 등
  mutate {
    add_field => {
      "[data_stream][type]"      => "logs"
      "[data_stream][dataset]"   => "%{[event][dataset]}"
      "[data_stream][namespace]" => "%{[service][environment]}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # api_key 인증은 Logstash가 TLS를 요구한다 — ES가 HTTP라 전용 사용자로 붙는다
    user => "logstash_writer"
    password => "${LOGSTASH_ES_PASSWORD}"
    ecs_compatibility => "v8"
    data_stream => true
    data_stream_auto_routing => true
  }
}
