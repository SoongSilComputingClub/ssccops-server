spring:
  application:
    name: ssccops-server

  jpa:
    show-sql: false
    defer-datasource-initialization: true # Hibernate가 스키마를 만든 뒤 data.sql이 실행되도록 순서 보장
    properties:
      hibernate:
        format_sql: true

  # Flyway (ssccops#213) — 스키마 변경을 버전 관리된 마이그레이션으로 내보낸다.
  #
  # **아직 꺼져 있다.** V1__baseline.sql이 플레이스홀더이기 때문이다. baseline은 prod의 현재
  # 스키마 덤프여야 하고(엔티티 기준 DDL로 잡으면 prod에 남은 고아 컬럼과 어긋나 첫 validate가
  # 터진다), 그 덤프는 DB 접근 권한이 있는 사람이 떠야 한다.
  #
  #   pg_dump --schema-only --no-owner --no-privileges -d "<prod 접속 문자열>" > V1__baseline.sql
  #
  # 켜는 순서는 AGENTS.md '스키마 변경' 절에 있다. 먼저 켜면 안 되는 이유는 배포 구조 때문이다 —
  # Coolify가 develop 푸시를 dev로 자동 배포하므로(#202), 플레이스홀더인 채로 켜면 머지되는
  # 순간 dev 부팅이 깨진다.
  flyway:
    enabled: false
    locations: classpath:db/migration
    # baseline-on-migrate: 이미 테이블이 있는 DB(dev·prod)에 Flyway를 처음 붙일 때 필요하다.
    # 없으면 "빈 DB가 아니다"라며 거부한다. baseline-version=1은 V1을 '이미 적용된 것'으로
    # 표시해 그 뒤(V2·V3)부터 돌게 한다 — V1의 내용이 곧 그 DB의 현재 모습이므로 맞다.
    baseline-on-migrate: true
    baseline-version: 1

  sql:
    init:
      mode: always # data.sql이 WHERE NOT EXISTS로 멱등하게 작성되어 있어 매 기동마다 실행해도 안전
      # data.sql을 읽는 문자셋을 UTF-8로 못 박는다.
      #
      # 이 값을 비워 두면 스프링이 **JVM 기본 문자셋**으로 파일을 읽는다. 그 값은 JDK 17에서
      # 아직 플랫폼을 따라가므로(UTF-8 고정은 JDK 18의 JEP 400부터다) 한국어 Windows에서는
      # MS949가 되고, UTF-8로 저장된 이 파일의 한글 기준값이 깨진 채로 INSERT 된다.
      # 기동은 성공하는데 '예산지출'·'최고관리자' 같은 이름으로 시드를 찾는 코드가 전부 빗나가는
      # 종류의 고장이라(하위 업무 유형 조회 실패 · 최초 가입자 부트스트랩 실패 → 403 연쇄)
      # 원인이 문자셋이라는 사실이 증상에서 드러나지 않는다. Linux CI는 기본이 UTF-8이라
      # 초록인 채로 남고 Windows 로컬에서만 터진다.
      encoding: UTF-8

  # 회원 명부 CSV 이관(#84). 업무 상한은 5MB이며 그 판정은 MemberImportServiceImpl이 한다 —
  # 여기서 5MB로 끊으면 서블릿 계층이 먼저 걸러 도메인 오류 코드(INVALID_CSV_FILE)가 붙지 않은
  # 응답이 나가고, 위저드가 무엇이 잘못됐는지 안내하지 못한다. 그래서 이 값은 상한보다 **높게**
  # 두어 정상 경로가 서비스에 닿게 하고, 스프링 부트 기본값(1MB)이 3MB짜리 정상 명부를 500으로
  # 떨어뜨리는 것만 막는다. 무한정 받지 않도록 요청 전체는 16MB로 묶는다.
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        connect-timeout: 5s
        read-timeout: 10s

# OpenTelemetry Spring Boot Starter configuration
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
  logs:
    exporter: otlp
  traces:
    exporter: otlp
  metrics:
    exporter: none  # Use micrometer-registry-otlp instead
  resource:
    attributes:
      service.name: ${spring.application.name}

# Frontend Configuration (CORS 허용 오리진)
frontend:
  url: http://localhost:5173

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

