name: "🧹 Chore"
description: "문서 · 테스트 · CI/CD · 빌드 설정 등 제품 동작과 무관한 작업"
title: "[CHORE] "
labels: ["chore"]
type: SubTask
body:
  - type: markdown
    attributes:
      value: |
        제목 앞 `[CHORE]`를 **지우지 마세요.** 이 접두사로 브랜치와 라벨이 자동 생성됩니다.

        커밋 타입이 `docs`·`test`·`cicd`·`chore`인 작업이 전부 여기 해당합니다.
        **세부 종류는 등록 후 라벨로 구분하세요** (`docs`·`test`·`cicd`) — 묻는 것이 같은 일을
        템플릿으로 다시 가르지 않습니다.

  - type: textarea
    id: description
    attributes:
      label: 📄 설명
      description: |
        **무엇이 불편했는지.** 문서·설정 작업도 이유가 있습니다 — 무엇을 찾지 못했는지,
        어떤 빌드가 왜 깨졌는지.
      placeholder: |
        `data.sql`의 시드 포인터가 517행 '폼 라벨' 문단 안에 묻혀 있어 `INSERT INTO form`으로
        grep하는 사람에게 잡히지 않는다. 실제로 그 경로로 "시드가 없다"는 오진이 나왔다.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: ✅ 작업할 내용
      description: 체크박스로 씁니다.
      value: |
        - [ ]
        - [ ]
      placeholder: |
        - [ ] `data.sql` 최상단 주석 블록에 "이 파일에 없는 시드가 하나 있다"를 적는다
        - [ ] `AGENTS.md` 로컬 실행 절에 같은 사실을 적는다
    validations:
      required: true

  - type: textarea
    id: precheck
    attributes:
      label: 🔍 먼저 확인할 것
      description: |
        CI·빌드 설정 변경이면 **무엇으로 검증하는가**를 적습니다. 문서 작업이면 비워 두세요.
      placeholder: |
        - [ ] 워크플로 변경은 브랜치에 푸시해 실제로 도는 것을 확인한다 — 문법이 맞아도 안 돌 수 있다
    validations:
      required: false

  - type: textarea
    id: refs
    attributes:
      label: 🙋🏻 참고 자료
      description: 상위 이슈, 관련 파일 경로.
      placeholder: |
        - 상위: SoongSilComputingClub/ssccops#152
        - `src/main/resources/data.sql` · `AGENTS.md`
    validations:
      required: false
