spring:
  application:
    name: ssccops-server

  jpa:
    show-sql: false
    defer-datasource-initialization: true # Hibernate가 스키마를 만든 뒤 data.sql이 실행되도록 순서 보장
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always # data.sql이 WHERE NOT EXISTS로 멱등하게 작성되어 있어 매 기동마다 실행해도 안전

  # 회원 명부 CSV 이관(#84). 업무 상한은 5MB이며 그 판정은 MemberImportServiceImpl이 한다 —
  # 여기서 5MB로 끊으면 서블릿 계층이 먼저 걸러 도메인 오류 코드(INVALID_CSV_FILE)가 붙지 않은
  # 응답이 나가고, 위저드가 무엇이 잘못됐는지 안내하지 못한다. 그래서 이 값은 상한보다 **높게**
  # 두어 정상 경로가 서비스에 닿게 하고, 스프링 부트 기본값(1MB)이 3MB짜리 정상 명부를 500으로
  # 떨어뜨리는 것만 막는다. 무한정 받지 않도록 요청 전체는 16MB로 묶는다.
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        connect-timeout: 5s
        read-timeout: 10s

# OpenTelemetry Spring Boot Starter configuration
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
  logs:
    exporter: otlp
  traces:
    exporter: otlp
  metrics:
    exporter: none  # Use micrometer-registry-otlp instead
  resource:
    attributes:
      service.name: ${spring.application.name}

# Frontend Configuration (CORS 허용 오리진)
frontend:
  url: http://localhost:5173

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

