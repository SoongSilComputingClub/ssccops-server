name: Issue Labeler

# 이슈 제목의 유형 태그로 라벨을 붙인다.
#
# 태그 → 라벨 매핑은 issue-branch-creator.yml의 태그 → 브랜치 접두어 매핑과 **같은 표여야 한다.**
# 둘이 갈리면 같은 이슈에 `fix/` 브랜치와 `bug` 라벨이 붙는 식이 되는데, 실제로 그런 상태였다
# (이쪽만 bug를 별도 라벨로 보내고 있었다). 한쪽을 고칠 때 반드시 다른 쪽도 함께 본다.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add_label:
    runs-on: ubuntu-latest
    if: github.event.issue.user.login != 'github-actions[bot]'

    steps:
      - name: Parse title prefix and add label
        env:
          # 제목을 ${{ }}로 run 안에 직접 박지 않는다. 따옴표·백틱·$(...)가 들어간 제목이
          # 스크립트를 깨뜨리거나 그대로 실행된다 — 예: [FIX] "폼 저장" 실패
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG=$(printf '%s' "$ISSUE_TITLE" | grep -oE '^\[[A-Za-z]+\]' | tr -d '[]' \
                | tr '[:upper:]' '[:lower:]' || true)

          # 템플릿이 주는 네 가지가 정본이고, 나머지는 손으로 칠 때를 위한 별칭이다.
          # 세부 종류(docs·test·cicd)는 원칙적으로 라벨로 가르지만, 접두어로 들어와도
          # 조용히 feat이 되지 않도록 여기서 받는다.
          case "$TAG" in
            feat)          LABEL="feat" ;;
            fix|bug)       LABEL="fix" ;;
            refactor)      LABEL="refactor" ;;
            chore)         LABEL="chore" ;;
            docs)          LABEL="docs" ;;
            test)          LABEL="test" ;;
            cicd)          LABEL="cicd" ;;
            *)
              # 태그가 없으면 feat으로 떨어진다. 조용히 넘기지 않는 것이 요점이다 —
              # 이 조용한 기본값 때문에 결함 수정 이슈에 feat 라벨이 붙어 왔다.
              LABEL="feat"
              echo "::warning::제목에 유형 태그가 없어 '$LABEL' 라벨로 처리합니다 (제목: $ISSUE_TITLE)"
              ;;
          esac

          gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL" --repo "$REPO"
