services:
  backend:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      db-url: jdbc:postgresql://postgres:5432/${db-name:-ssccops_server_db}
      db-username: ${db-username}
      db-password: ${db-password}
      supabase-url: ${supabase-url}
      frontend-url: ${frontend-url:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${db-name:-ssccops_server_db}
      POSTGRES_USER: ${db-username}
      POSTGRES_PASSWORD: ${db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db-username} -d ${db-name:-ssccops_server_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: