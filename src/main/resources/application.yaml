spring:
  application:
    name: ssccops-server

  jpa:
    show-sql: false
    defer-datasource-initialization: true # Hibernate가 스키마를 만든 뒤 data.sql이 실행되도록 순서 보장
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always # data.sql이 WHERE NOT EXISTS로 멱등하게 작성되어 있어 매 기동마다 실행해도 안전

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        connect-timeout: 5s
        read-timeout: 10s

# OpenTelemetry Spring Boot Starter configuration
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
  logs:
    exporter: otlp
  traces:
    exporter: otlp
  metrics:
    exporter: none  # Use micrometer-registry-otlp instead
  resource:
    attributes:
      service.name: ${spring.application.name}

# Frontend Configuration (CORS 허용 오리진)
frontend:
  url: http://localhost:5173

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

