# ============================================================================
# Backend Deploy Workflow - Prod (GHCR + Coolify)
# ============================================================================
# 역할:
#   - Integrate Production 이 main 푸시(릴리스 머지)에서 끝난 뒤 자동 실행
#   - 레포의 멀티스테이지 Dockerfile 로 이미지를 빌드해 GHCR 에 푸시(태그 `prod` · `sha-<7>`)
#   - Coolify 배포 웹훅을 불러 prod api 가 그 이미지를 받아 기동하게 한다
#
# Job 구조:
#   prepare ──> build-image ──> deploy
#
#   prepare 는 «무엇을 빌드하나(커밋)»와 «빌드해도 되나(Lint·Test 결과)»만 판정한다.
#   판정이 서지 않으면 아래 둘은 실패가 아니라 회색이다 — 아래 job 주석에 이유가 있다.
#   **예외는 수동 실행의 거절이다** — main 에 없는 커밋을 고르면 빨갛게 실패한다(prepare 주석).
#
# 트리거:
#   - Integrate Production 이 main 에서 완료됐을 때(conclusion 은 prepare 가 따로 본다)
#   - 수동 실행(workflow_dispatch) — 입력 `ref`(기본 `main`)의 커밋으로 빌드한다. **main 에 있는
#     커밋만** 받는다. `skip_deploy` 로 이미지만 올린다
#
# **deploy-dev.yml 과 같은 모양이다 — 그렇게 두는 것이 이 파일의 규칙이다** (#581 · ssccops#519).
# 두 파일을 나란히 놓았을 때 달라야 할 자리는 아래 표뿐이고, 나머지(job 구조 · 셸 설정 · 시크릿
# 모양 진단 · POST · 실패 응답 본문 · Summary)는 글자까지 같게 둔다. **한쪽을 고치면 다른 쪽도
# 본다** — `diff .github/workflows/deploy-dev.yml .github/workflows/deploy-prod.yml` 이 이 표와
# 머리 주석 밖을 보이면 갈라진 것이다.
#
#   | 자리           | deploy-dev.yml               | deploy-prod.yml                     |
#   |----------------|------------------------------|-------------------------------------|
#   | 트리거         | Integrate Dev · develop      | Integrate Production · main         |
#   | 이미지 태그    | dev · sha-<7>                | prod · sha-<7>                      |
#   | 배포 웹훅      | COOLIFY_DEV_DEPLOY_WEBHOOK   | COOLIFY_PROD_DEPLOY_WEBHOOK         |
#   | concurrency    | deploy-dev                   | deploy-prod                         |
#   | 수동 실행 커밋 | 지금 ref 의 커밋             | 입력 ref — main 의 조상만           |
#
# reusable workflow(workflow_call) 하나로 합치지 않은 이유는 ssccops#519 — 차이가 입력값으로 빠져
# 한 화면에서 읽히지 않는다.
#
# **⚠️ 이 레포의 기본 브랜치는 develop 이다.** workflow_run 은 기본 브랜치의 워크플로 파일을 쓰므로
# 이 파일은 릴리스가 아니라 **develop 에 머지되는 순간** 살아나고, develop 에서 고친 내용이 다음
# 릴리스의 prod 배포에 곧바로 쓰인다. 그리고 그 실행의 `github.sha` 는 develop 머리다 — 커밋을
# payload 에서 읽지 않으면 **출시하지 않은 코드가 prod 이미지가 된다**(prepare 주석).
#
# **릴리스 절차는 바뀌지 않는다.** 버전 커밋(develop 먼저) → develop → main regular merge →
# `gh release create` → deploy-history.yml(release: published)이 /actuator/info 를 폴링해 남긴다.
# 이 워크플로가 바꾼 것은 «main 푸시 뒤 누가 이미지를 만들고 배포를 부르나» 하나다.
#
# **빌드를 Coolify 호스트에서 여기로 옮긴 이유** (#581 · ssccops#519 — dev 는 #569 · ADR-0050):
# 호스트 빌드는 CI 를 기다리지 않아 **Integrate Production 이 빨간 릴리스 커밋도 prod 에 올라갔고**,
# dev(Actions 러너)와 prod(Coolify 호스트)가 같은 Dockerfile 을 다른 빌드 컨텍스트에서 돌려 그 차이에
# 걸리는 변경이 릴리스에서 처음 드러났다(#422 `COPY .git`). 이 경로는 Lint·Test 를 통과한 커밋만,
# dev 와 같은 러너에서 이미지가 된다.
#
# **환경변수는 Coolify 가 정본이다.** 이 워크플로는 애플리케이션 환경변수를 한 개도 넣지 않는다 —
# #202 가 걷어낸 `envs/bulk` 덮어쓰기를 되살리지 않는다(Actions 가 배포마다 덮어써 대시보드에서
# 넣은 값이 날아갔다). 여기 있는 시크릿은 «배포를 부르는 데» 필요한 둘뿐이다.
#
# GitHub Secrets:
#   - GITHUB_TOKEN                : GHCR 푸시. 기본 제공이며 새 시크릿이 아니다(permissions.packages: write)
#   - COOLIFY_API_TOKEN           : Coolify API 토큰(deploy 권한만) — deploy-dev.yml 과 같은 시크릿이다
#   - COOLIFY_PROD_DEPLOY_WEBHOOK : prod api 의 배포 웹훅 URL.
#       **변수(vars)가 아니라 시크릿이다** — 이 레포가 Public 이라 Actions 로그가 공개되고
#       변수는 마스킹되지 않는다. **비어 있으면 배포 호출을 건너뛰고 경고만 남긴다** — 그래서 이
#       워크플로는 Coolify 리소스 전환보다 먼저 머지해도 안전하다(옛 git 빌드 경로가 그대로 돈다).
#       전환은 두 단계다(ssccops#519): 먼저 검증 자리 `ghcr.api.sscc-ssu.com` 리소스의 웹훅을 넣고,
#       정상 배포를 본 뒤 그 리소스로 도메인 `api.sscc-ssu.com` 을 옮긴다 — 웹훅은 리소스에 붙어
#       있어 도메인을 옮겨도 이 값은 그대로다.
#
# GHCR 패키지는 **Private** 이다(ADR-0050) — Coolify 호스트가 GHCR 에 로그인해 받는다. 그 로그인이
# 만료되면 Actions 는 초록인데 Coolify pull 만 실패한다(토큰 주인·만료: 메타 docs/project/dev-deploy.md).
# ============================================================================

name: Deploy Prod

on:
  workflow_run:
    workflows: ["Integrate Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 빌드할 커밋 sha · 태그(vX.Y.Z) · 브랜치. main 에 있는 커밋만 받는다
        type: string
        default: main
      skip_deploy:
        description: 이미지만 GHCR 에 올리고 Coolify 배포는 부르지 않는다
        type: boolean
        default: false

# 취소하지 않는다 — 두 푸시가 겹치면 늦게 끝난 옛 빌드가 고정 태그 `prod` 를 덮어쓸 수 있다.
# 직렬화하면 그 순서가 커밋 순서와 같아진다. 대기 중인 것은 더 새 푸시로 대체된다
# (GitHub 은 pending 을 하나만 남긴다) — 버려지는 것은 이미 낡은 이미지다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR 은 소문자 경로만 받는데 조직명은 SoongSilComputingClub 이다. `github.repository` 를 쓰면
  # 워크플로 env 에서는 소문자로 바꿀 자리가 없어(`tr` 을 쓸 수 있는 곳은 step 안뿐이다) 여기서는
  # 못 박는다 — 요약과 라벨이 실제로 푸시되는 이름과 갈리지 않는 쪽이 낫다.
  IMAGE_NAME: ghcr.io/soongsilcomputingclub/ssccops-server

jobs:
  # ==========================================================================
  # Prepare Job - 무엇을 빌드할지, 빌드해도 되는지
  # ==========================================================================
  #
  # **workflow_run 의 `github.sha` 는 기본 브랜치(develop)의 머리이지 그 실행의 커밋이 아니다.**
  # dev 에서는 «레코드가 unverified» 로 끝나는 실수가 여기서는 **develop 머리 — 출시하지 않은
  # 코드 — 가 prod 이미지가 되는 것**이다. 커밋은 이벤트 payload 의 head_sha 에서 읽어 아래 job
  # 들에 넘기고, checkout · 태그 · SOURCE_COMMIT 셋 다 그 값만 쓴다. SOURCE_COMMIT 은
  # /actuator/info 의 git.commit.id 가 되고 deploy-history 가 그것으로 «정말 이 커밋이 떴나»를
  # 확인한다(#422 · ssccops#340).
  #
  # **판정은 워크플로 전체 conclusion 이 아니라 Lint·Test job 의 결과다.** deploy-dev 와 같은
  # 판정이다. integrate-prod 에는 analyze 가 없어 지금은 conclusion 으로 봐도 결과가 같지만,
  # 두 파일이 같은 규칙이어야 한쪽에 Sonar 가 붙는 날 조용히 갈리지 않는다(ADR-0018 · #477).
  #
  # 통과하지 못하면 실패가 아니라 **건너뜀(회색)** 이다. Integrate Production 이 이미 빨간색으로
  # 그 사실을 말하고 있으므로 같은 사실을 두 번 빨갛게 만들지 않는다(sonar-preflight 와 같은 판단, #477).
  #
  # `branches: [main]` 은 트리거한 실행의 **head 브랜치 이름**만 본다 — 릴리스 PR(head develop)의
  # pull_request 실행은 여기서 빠지지만, 포크의 `main` 에서 온 PR 은 이름이 같아 통과한다.
  # 그것을 거르는 것이 아래 `RUN_EVENT != push` 판정이다.
  #
  # **수동 실행은 main 에 있는 커밋만 받는다.** 실행 화면은 아무 브랜치나 고르게 해 주고 이 파일은
  # develop 에 먼저 있으므로, 지금 ref 로 빌드하면(deploy-dev 의 모양) develop 머리가 prod 로 간다.
  # 그래서 입력 `ref` 를 sha 로 풀어 main 의 조상인지(compare 가 ahead·identical) 본다. 이 모양이어야
  # 이 파일이 아직 main 에 없을 때(다음 릴리스 전)도 develop 에서 실행해 **main HEAD 를** 빌드할 수
  # 있다 — 검증 자리를 세우는 첫 배포가 그것이다(ssccops#519 ②). 옛 릴리스 커밋을 고르면 롤백 빌드다.
  # 거절은 회색이 아니라 **빨강**이다 — 사람이 누른 것이 거절됐다는 사실은 보여야 한다.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read # 트리거한 실행의 job 목록을 읽는다

    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}

    steps:
      - name: Resolve commit and CI verdict
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -uo pipefail
          # 기본 셸이 `bash -e {0}` 라 gh 호출 하나가 실패하면 판정도 출력도 없이 job 이 죽는다
          # (#573 — deploy step 과 같은 함정). 종료 코드를 받아 «건너뜀»으로 떨어뜨린다.
          set +e

          # 요구하는 job 이름은 integrate-prod.yml 의 `name:` 그대로다. 그쪽 이름을 바꾸면
          # 여기서 «찾을 수 없다»가 되어 배포가 건너뛰어진다 — 조용히 통과하지는 않는다.
          REQUIRED_JOBS='Lint Test'
          # prod 에 나가도 되는 커밋은 이 브랜치에 있는 것뿐이다
          RELEASE_BRANCH='main'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            REF="${INPUT_REF:-$RELEASE_BRANCH}"

            # 입력은 사람이 친 문자열이다 — API 경로에 넣기 전에 모양을 가둔다
            if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error title=수동 실행 거절::ref '${REF}' 는 커밋 · 태그 · 브랜치 이름의 모양이 아니다."
              exit 1
            fi

            HEAD_SHA=$(gh api "repos/${REPO}/commits/${REF}" --jq '.sha')
            GH_RC=$?
            if [ "$GH_RC" -ne 0 ] || [ -z "$HEAD_SHA" ]; then
              echo "::error title=수동 실행 거절::ref '${REF}' 를 커밋으로 풀지 못했다(gh 종료 코드 ${GH_RC})."
              exit 1
            fi

            # compare/{base}...{head} 의 status 가 ahead·identical 이면 head(main)가 base 를 품는다
            COMPARE=$(gh api "repos/${REPO}/compare/${HEAD_SHA}...${RELEASE_BRANCH}" --jq '.status')
            case "$COMPARE" in
              ahead|identical) ;;
              *)
                echo "::error title=수동 실행 거절::${HEAD_SHA} 는 ${RELEASE_BRANCH} 에 없는 커밋이다(compare: ${COMPARE:-실패}). prod 에는 릴리스된 커밋만 나간다."
                exit 1
                ;;
            esac

            PROCEED=true
            echo "수동 실행 — ref ${REF} 의 커밋 ${HEAD_SHA} 로 빌드한다(${RELEASE_BRANCH} 에 있다 · ${COMPARE})."
            echo "::warning title=CI 게이트 건너뜀::수동 실행이라 Lint·Test 결과를 보지 않는다."
          else
            HEAD_SHA="$RUN_SHA"
            PROCEED=true

            if [ "$RUN_EVENT" != 'push' ]; then
              echo "::notice::Integrate Production 이 push 가 아닌 '${RUN_EVENT}' 로 돌았다 — 배포 대상이 아니다."
              PROCEED=false
            elif [ "$RUN_CONCLUSION" = 'cancelled' ]; then
              echo "::notice::Integrate Production 이 취소됐다 — 배포하지 않는다. ${RUN_URL}"
              PROCEED=false
            else
              JOBS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                --paginate --jq '.jobs[] | "\(.name)=\(.conclusion)"')
              GH_RC=$?
              if [ "$GH_RC" -ne 0 ]; then
                echo "::warning title=배포 건너뜀::Integrate Production 의 job 목록을 읽지 못했다(gh 종료 코드 ${GH_RC}). 판정할 수 없으므로 배포하지 않는다. ${RUN_URL}"
              fi
              for JOB in $REQUIRED_JOBS; do
                CONCLUSION=$(printf '%s\n' "$JOBS" | awk -F= -v n="$JOB" '$1 == n { print $2 }')
                if [ "$CONCLUSION" = 'success' ]; then
                  echo "  $JOB = success"
                else
                  echo "::warning title=배포 건너뜀::Integrate Production 의 '${JOB}' job 이 success 가 아니다(${CONCLUSION:-찾을 수 없음}). ${RUN_URL}"
                  PROCEED=false
                fi
              done
            fi
          fi

          SHORT_SHA=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          {
            echo "proceed=$PROCEED"
            echo "head_sha=$HEAD_SHA"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          if [ "$PROCEED" != 'true' ]; then
            echo "⏭️ **prod 배포 건너뜀** — 위 경고의 이유다. 이미지도 올리지 않는다." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ==========================================================================
  # Build Image Job - 멀티스테이지 Dockerfile 로 빌드해 GHCR 에 푸시
  # ==========================================================================
  #
  # **Dockerfile 은 레포의 그것 하나다.** CI 가 만든 JAR 을 얇은 Dockerfile(옛 Dockerfile.deploy)에
  # 담는 길은 택하지 않았다 — Dockerfile 이 두 벌이 되어 로컬 `docker compose` 와 배포가 갈린다
  # (#202 가 그것을 걷어낸 이유). 속도는 buildx 의 GHA 캐시로 얻는다.
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.proceed == 'true'

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # 고정 태그 `prod` 를 Coolify 가 다시 받고, `sha-<7>` 은 롤백용으로 함께 올려만 둔다.
          # 배포마다 Coolify 앱의 이미지 태그를 새 sha 로 PATCH 하는 길은 택하지 않았다 —
          # Actions 가 배포마다 앱 설정을 고치게 된다(#569 · ssccops#513).
          #
          # `type=sha` 를 쓰지 않는 것은 metadata-action 이 GITHUB_SHA 를 읽기 때문이다 —
          # workflow_run 에서 그 값은 기본 브랜치의 머리다(위 prepare 주석). 태그도 라벨도
          # prepare 가 준 커밋으로 못 박는다. `image.source` 라벨은 액션이 알아서 붙이며,
          # GHCR 패키지가 이 레포에 연결되는 것이 그 라벨이다.
          tags: |
            type=raw,value=prod
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.head_sha }}
            org.opencontainers.image.version=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          # 러너가 만드는 것은 amd64 다. prod api 호스트가 x86_64 인지는 전환 전에 확인한다
          # (#581 «먼저 확인할 것»). arm64 호스트로 옮기면 이 줄과 docker/setup-qemu-action 을 함께 본다.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 이 값이 /actuator/info 의 git.commit.id 가 되고 deploy-history 가 그것으로 배포를
          # 확인한다(#422 · ssccops#340). 빠뜨리면 prod 레코드가 전부 unverified 다.
          # `.git` 을 이미지에 복사하지 않는 이유는 Dockerfile 주석에 있다.
          build-args: |
            SOURCE_COMMIT=${{ needs.prepare.outputs.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy Job - Coolify 배포 웹훅 호출
  # ==========================================================================
  #
  # 레지스트리 푸시는 Coolify 배포를 트리거하지 않으므로(ADR-0048) 배포 호출은 이쪽이 한다.
  # 호스트가 GHCR 을 폴링하는 길(Watchtower 부류)은 택하지 않았다 — Coolify 가 모르는 사이
  # 컨테이너가 바뀌어 상태·헬스체크·롤백과 어긋난다.
  #
  # **환경변수는 넣지 않는다.** 정본은 Coolify 대시보드이고 이 job 은 «배포해라»만 말한다.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [prepare, build-image]

    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          WEBHOOK: ${{ secrets.COOLIFY_PROD_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SKIP_DEPLOY: ${{ github.event.inputs.skip_deploy }}
        run: |
          set -uo pipefail
          # **Actions 의 기본 셸은 `bash -e {0}` 다** (#573). 끄지 않으면 curl 이 0 이 아닌 값으로
          # 끝나는 순간 셸이 즉시 죽어 **아래 오류 처리가 한 줄도 실행되지 않는다** — 실제로
          # «exit code 43» 네 글자만 남아 원인을 좁히는 데 세 번의 왕복이 들었다. 종료 코드를
          # 받아 판단하려면 꺼야 한다(integrate-dev 의 api-compat step 이 같은 자리에서 배운 것).
          set +e

          # 값은 절대 찍지 않는다 — 길이와 «이상한 문자가 섞였나»만 센다. 붙여넣기 사고
          # (줄바꿈이 딸려 들어감 · 코드 조각을 그대로 넣음)가 이 진단이 없으면 바깥에서 보이지 않는다.
          shape() {
            printf '길이=%s 개행=%s CR=%s 탭=%s 공백=%s' \
              "${#1}" \
              "$(printf '%s' "$1" | tr -cd '\n' | wc -c | tr -d ' ')" \
              "$(printf '%s' "$1" | tr -cd '\r' | wc -c | tr -d ' ')" \
              "$(printf '%s' "$1" | tr -cd '\t' | wc -c | tr -d ' ')" \
              "$(printf '%s' "$1" | tr -cd ' '  | wc -c | tr -d ' ')"
          }

          report_shapes() {
            echo "시크릿 값의 모양 (값 자체는 찍지 않는다):"
            echo "  COOLIFY_PROD_DEPLOY_WEBHOOK $(shape "$WEBHOOK_RAW")"
            echo "  COOLIFY_API_TOKEN           $(shape "$TOKEN_RAW")"
          }

          if [ "${SKIP_DEPLOY:-}" = 'true' ]; then
            echo "outcome=skipped-input" >> "$GITHUB_OUTPUT"
            echo "::notice::skip_deploy 입력이라 배포 호출을 건너뛴다 — 이미지는 올라갔다."
            exit 0
          fi

          WEBHOOK_RAW="$WEBHOOK"
          TOKEN_RAW="$TOKEN"

          # 붙여넣기에 딸려 온 줄바꿈·앞뒤 공백을 걷어낸다. **헤더 값 안의 개행은 curl 이
          # 헤더 인젝션으로 보고 요청 자체를 거부한다**(종료 코드 43). 조용히 고치지 않고
          # 달라졌으면 경고를 남긴다 — 시크릿을 제대로 다시 넣게 하기 위해서다.
          WEBHOOK=$(printf '%s' "$WEBHOOK_RAW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TOKEN=$(printf '%s' "$TOKEN_RAW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ "$WEBHOOK" != "$WEBHOOK_RAW" ] || [ "$TOKEN" != "$TOKEN_RAW" ]; then
            echo "::warning title=시크릿 값에 군더더기가 있다::줄바꿈이나 앞뒤 공백을 걷어내고 호출한다. 이번엔 넘어가지만 시크릿을 한 줄로 다시 넣을 것."
            report_shapes
          fi

          if [ -z "$WEBHOOK" ]; then
            echo "outcome=skipped-secret" >> "$GITHUB_OUTPUT"
            echo "::warning title=Coolify 배포 호출 건너뜀::COOLIFY_PROD_DEPLOY_WEBHOOK 이 비어 있다. 이미지는 GHCR 에 올라갔고 prod 는 여전히 Coolify 의 git 빌드가 낸다 — 전환 전이면 정상이다."
            exit 0
          fi

          # URL 을 찍지 않는다 — 이 레포가 Public 이라 Actions 로그가 공개된다. 그래도 **-sS 로
          # 오류 메시지는 살린다**: -s 만 걸면 진행률과 함께 «왜 실패했는가»까지 사라진다.
          # 그 메시지에 URL 이 섞여 나올 수 있어 URL 모양의 문자열을 출력 전에 가린다 — GitHub
          # 마스킹은 시크릿 «전체»와 글자가 맞을 때만 듣기 때문에 조각으로 새는 길을 막는다.
          # 호스트명만 남는 형태(«Could not resolve host: …»)는 그대로 나가는데, 가려야 할 것은
          # 앱 uuid 이고 호스트는 이미 공개 DNS 다.
          CURL_ERR="$RUNNER_TEMP/curl-err.txt"
          CURL_BODY="$RUNNER_TEMP/curl-body.txt"
          CURL_HDR="$RUNNER_TEMP/curl-hdr.txt"

          # **POST 다 — GET 이 아니다** (#575). Coolify 의 /api/v1/deploy 는 GET 에서 POST 로
          # 바뀌었고, 지금 GET 으로 부르면 «405 · allow: POST · This endpoint has changed to a
          # POST request» 가 돌아온다(v4.3.23 실측). 이 워크플로가 구조를 따온
          # SSCC-Web-BE/deploy-staging.yml 은 GET 이었는데 그쪽은 일곱 달 전 버전에 맞춘 것이다.
          # **되돌리지 말 것** — 되돌리면 배포 호출이 전부 405 다.
          HTTP_STATUS=$(curl -sS -o "$CURL_BODY" -D "$CURL_HDR" -w '%{http_code}' \
            --max-time 30 \
            --request POST "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN" 2>"$CURL_ERR")
          CURL_RC=$?

          # 실패했을 때만 서버가 보낸 설명을 낸다. **이것이 없어 네 번을 헤맸다** — 405 의 이유는
          # 처음부터 본문 한 줄에 적혀 있었는데 -o /dev/null 이 그것을 버리고 있었다(#575).
          # 성공 본문은 배포 uuid 뿐이라 찍지 않는다. URL 모양 문자열은 가린다(#573 과 같은 규칙).
          dump_response() {
            echo "응답 헤더:"
            grep -iE '^(allow|content-type|www-authenticate|retry-after):' "$CURL_HDR" | tr -d '\r' | sed 's/^/  /'
            echo "응답 본문:"
            sed -e 's#https\{0,1\}://[^[:space:]"]*#<url>#g' "$CURL_BODY" | head -c 2000 | sed 's/^/  /'
            echo
          }

          # 종료 코드 != 0 은 «요청이 나가지도 않았다» 또는 «전송이 끊겼다»이고, HTTP 상태는
          # «서버가 받고 거절했다»다. 둘을 가르지 않으면 Coolify 를 의심하며 시간을 버린다.
          if [ "$CURL_RC" -ne 0 ]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            echo "curl 종료 코드: ${CURL_RC} (요청이 서버에 닿지 못했다)"
            sed -e 's#https\{0,1\}://[^[:space:]]*#<url>#g' "$CURL_ERR"
            report_shapes
            echo "::error::Coolify 배포 호출이 curl 종료 코드 ${CURL_RC} 로 실패했다 — 요청이 나가지도 않았다. 위의 «시크릿 값의 모양»부터 볼 것(43 이면 대개 헤더 값 안의 줄바꿈이다)."
            exit 1
          fi

          if [ "${HTTP_STATUS:-0}" -lt 200 ] || [ "${HTTP_STATUS:-0}" -ge 300 ]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            dump_response
            echo "::error::Coolify 배포 호출이 HTTP ${HTTP_STATUS} 로 실패했다 — 서버가 받고 거절했다. **위의 «응답 본문»이 이유를 말한다.** 이미지는 GHCR 에 있으니 Coolify 에서 손으로 Deploy 하면 된다."
            exit 1
          fi

          echo "outcome=triggered" >> "$GITHUB_OUTPUT"
          echo "Coolify 배포를 호출했다 (HTTP ${HTTP_STATUS})."

      # 배포가 «떴다»를 여기서 확인하지 않는다 — deploy-history.yml 이 /actuator/info 의
      # git.commit.id 를 폴링해 그 판정을 레코드로 남긴다(ADR-0033). 두 곳에서 같은 것을
      # 기다리면 한쪽 값이 낡는다.
      - name: Deploy Summary
        if: always()
        env:
          OUTCOME: ${{ steps.trigger.outputs.outcome }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          case "${OUTCOME:-}" in
            triggered)       STATUS='✅ Coolify 배포 호출됨' ;;
            skipped-input)   STATUS='⏭️ 건너뜀 — skip_deploy 입력' ;;
            skipped-secret)  STATUS='⚠️ 건너뜀 — COOLIFY_PROD_DEPLOY_WEBHOOK 이 비어 있다' ;;
            *)               STATUS='❌ 배포 호출 실패' ;;
          esac

          {
            echo "## Deploy Summary (Prod)"
            echo "- **Commit** : \`${HEAD_SHA}\`"
            echo "- **Image**  : \`${IMAGE_NAME}:prod\` · \`${IMAGE_NAME}:sha-${SHORT_SHA}\`"
            echo "- **Digest** : \`${DIGEST}\`"
            echo "- **Deploy** : ${STATUS}"
            echo "- **환경변수**: Coolify 가 정본이다 — 이 워크플로는 넣지 않는다"
          } >> "$GITHUB_STEP_SUMMARY"
