spring:
  datasource:
    url: ${DEV_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DEV_DATABASE_USER}
    password: ${DEV_DATABASE_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${DEV_SUPABASE_URL}/auth/v1/.well-known/jwks.json
          # issuer·audience 검증(#383 · ADR-0026). 같은 env에서 파생한다 — 새 env 없음
          issuer-uri: ${DEV_SUPABASE_URL}/auth/v1

  jpa:
    hibernate:
      # 재시작마다 전체 재생성하지 않는다(ssccops#83). Render 무료 티어에서 create-drop이
      # 테이블 수 증가와 겹치며 부팅이 헬스체크 타임아웃을 넘겨 update_failed가 반복됐고,
      # 한 번은 기준 코드 시드가 일부만 들어간 채로 떠 회원가입이 500을 냈다(mbr_grd.TEMP 누락).
      # update는 추가만 반영하고 컬럼 삭제·타입 변경은 반영하지 않는다 — dev 환경 한정으로
      # 감수하는 트레이드오프다. 드리프트가 실제 문제가 되면 수동 ALTER로 정리하거나
      # Flyway/Liquibase 도입을 검토한다.
      #
      # 그 작업이 ssccops#213이고 **이제 Flyway가 스키마를 만든다.** 여기가 validate인 것은
      # 엔티티와 실제 스키마가 어긋나면 **부팅을 실패시키기 위해서**다 — ssccops#209는 값이 든
      # 옛 컬럼 옆에서 빈 새 컬럼을 읽으며 정상 부팅했고, 그래서 아무도 몰랐다. validate면
      # 그 상태로는 뜨지 못하고 결함이 운영 화면이 아니라 배포 로그에서 드러난다.
      #
      # 스키마를 바꾸면서 마이그레이션 파일을 빠뜨리면 여기서 막힌다. 그것이 의도한 동작이다.
      ddl-auto: validate

  h2:
    console:
      enabled: false

# Cloudflare R2 (S3 호환 오브젝트 스토리지, ssccops#113)
r2:
  account-id: ${DEV_R2_ACCOUNT_ID}
  access-key-id: ${DEV_R2_ACCESS_KEY_ID}
  secret-access-key: ${DEV_R2_SECRET_ACCESS_KEY}
  bucket-name: ${DEV_R2_BUCKET_NAME}

# 이 API 자신의 공개 주소 (#208). 행사 이미지의 영구 읽기 주소
# ({app.public-base-url}/public/v1/events/{eventId}/images/{fileName})를 이 값으로 조립하며,
# 그 문자열이 행사 본문 마크다운에 굳는다 — 틀린 값을 넣으면 우리 도메인의 이미지 링크가
# 통째로 깨진다. **없거나 스킴이 빠지면 부팅이 실패한다**(#216 · AppPublicBaseUrl) — 설정 누락이
# 몇 시간 뒤 발급 500으로 발견되던 것을 배포 로그 첫 줄로 옮긴 것이다.
app:
  public-base-url: ${DEV_APP_PUBLIC_BASE_URL}

# Frontend Configuration (CORS 허용 오리진)
frontend:
  url: ${DEV_FRONTEND_URL}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

#OpenTelemetry : off
otel:
  sdk:
    disabled: true
management:
  otlp:
    metrics:
      export:
        enabled: false
    logging:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
